      const rr = 9 + 5*Math.sin(ph*.8 + i*2.1);
      const al = (.2 + .2*Math.sin(ph*4.3 + i))*nightF;
      if (al <= .03) continue;
      ctx.fillStyle = 'rgba(255,213,128,'+al.toFixed(3)+')';
      ctx.beginPath();
      ctx.arc(p.x+Math.cos(ph*1.25)*rr, cyc+Math.sin(ph*1.6)*rr*.38, 1.25, 0, 7);
      ctx.fill();
    }
  }

  const apexY = p.y - s.h - TH*0.31 - s.roofH - (b.type==='hall' ? 22 : 0);
  if (cut){
    const y = apexY-14, blink = reduceMotion ? 1 : 0.55+0.45*Math.sin(now()/300);
    ctx.globalAlpha = blink;
    if (!b.conn){                       // keine Straße: rotes Ausrufezeichen
      ctx.fillStyle = '#C46A5C';
      diamond(ctx,p.x,y,13,13); ctx.fill();
      ctx.fillStyle = '#0E1B24';
      ctx.fillRect(p.x-1,y-4,2,5); ctx.fillRect(p.x-1,y+2,2,2);
    } else {                            // kein Personal: Figur im blauen Feld
      ctx.fillStyle = '#6E93AE';
      diamond(ctx,p.x,y,13,13); ctx.fill();
      ctx.fillStyle = '#0E1B24';
      ctx.beginPath(); ctx.arc(p.x,y-3,1.8,0,7); ctx.fill();
      ctx.beginPath(); ctx.moveTo(p.x-2.6,y+4); ctx.lineTo(p.x-1.6,y-0.6);
      ctx.lineTo(p.x+1.6,y-0.6); ctx.lineTo(p.x+2.6,y+4); ctx.closePath(); ctx.fill();
    }
    ctx.globalAlpha = 1; return;
  }
  if (s.time > 0 && !ready){
    const w=30, y=apexY-12, x=p.x-w/2;
    ctx.fillStyle = 'rgba(10,20,27,.75)'; ctx.fillRect(x,y,w,3);
    ctx.fillStyle = 'rgba(242,176,53,.85)'; ctx.fillRect(x,y,w*progress(b),3);
  }
}

/* Angrenzende Bauabschnitte als Kaufangebot einzeichnen */
function drawOffers(){
  const list = offers();
  if (!list.length) return;
  const price = plotPrice();
  const ready = state.free === 0;
  const can = ready && state.coins >= price;
  const t = now();

  const visO = viewBox(TH*3);
  for (const o of list){
    const mid0 = iso(o.sx*P + (P-1)/2, o.sy*P + (P-1)/2);
    if (mid0.x < visO.x0-P*TW || mid0.x > visO.x1+P*TW ||
        mid0.y < visO.y0-P*TH || mid0.y > visO.y1+P*TH) continue;
    const c0 = iso(o.sx*P,       o.sy*P);
    const c1 = iso(o.sx*P+P-1,   o.sy*P);
    const c2 = iso(o.sx*P+P-1,   o.sy*P+P-1);
    const c3 = iso(o.sx*P,       o.sy*P+P-1);
    const pts = [[c0.x, c0.y-TH/2],[c1.x+TW/2, c1.y],[c2.x, c2.y+TH/2],[c3.x-TW/2, c3.y]];

    ctx.fillStyle = can ? 'rgba(242,176,53,.09)' : 'rgba(140,160,168,.05)';
    poly(ctx, pts); ctx.fill();
    ctx.strokeStyle = can ? 'rgba(242,176,53,'+(0.55+0.35*Math.sin(t/420))+')'
                          : 'rgba(140,160,168,.32)';
    ctx.lineWidth = 1.6; ctx.setLineDash([7,5]);
    poly(ctx, pts); ctx.stroke(); ctx.setLineDash([]);

    const mx = (pts[0][0]+pts[2][0])/2, my = (pts[0][1]+pts[2][1])/2;
    ctx.textAlign = 'center';
    ctx.fillStyle = can ? '#F2B035' : 'rgba(140,160,168,.7)';
    ctx.font = '600 13px "IBM Plex Mono", monospace';
    ctx.fillText(price.toLocaleString('de-DE'), mx, my - 2);
    ctx.font = '500 9px "IBM Plex Sans", sans-serif';
    ctx.fillStyle = 'rgba(140,160,168,.75)';
    ctx.fillText(ready ? 'Bauabschnitt kaufen' : state.free + ' Felder noch frei', mx, my + 12);
  }
}

/* Drei Wolken auf aufsteigender Bahn. Die Phase kommt von außen, damit nicht
   alle Schornsteine im Gleichtakt qualmen. */
function puffSmoke(g, x, y, phase){
  for (let i=0;i<3;i++){
    const t = ((now()/2100) + i/3 + phase) % 1;
    g.globalAlpha = (1-t)*0.22;
    g.fillStyle = '#C4CEC8';
    g.beginPath();
    g.arc(x + Math.sin(t*4 + phase*6)*5, y - t*26, 2.2 + t*5, 0, 7);
    g.fill();
  }
  g.globalAlpha = 1;
}

/* ============================================================
   LEBEN IM BILD
   Passanten brauchen kein Wegfinden: sie laufen los, und an jeder
   Kreuzung entscheidet der Zufall unter den anliegenden Straßenfeldern.
   Vögel, Wolkenschatten und Sternschnuppen leben allein von der Uhr.
============================================================ */
function netNeighbors(x,y){
  const out = [];
  for (const [dx,dy] of N4) if (state.net.has(key(x+dx,y+dy))) out.push([x+dx,y+dy]);
  return out;
}
function reseedWalkers(){
  walkerNetSize = state.net.size;
  walkers = [];
  if (reduceMotion || !state.net.size) return;
  const starts = [...state.net];
  const n = Math.max(2, Math.min(14, Math.floor(state.net.size/3)));
  for (let i=0;i<n;i++){
    const [sx,sy] = starts[(Math.random()*starts.length)|0].split(',').map(Number);
    const nb = netNeighbors(sx,sy);
    if (!nb.length) continue;
    const nxt = nb[(Math.random()*nb.length)|0];
    walkers.push({ fx:sx, fy:sy, tx:nxt[0], ty:nxt[1], px:sx, py:sy,
      t:Math.random(), spd:.4+Math.random()*.3, ph:Math.random()*7,
      col:['#CBD8DC','#C46A5C','#8FA6B8','#B89F6A','#7E8E96','#A67B5B'][i%6],
      hat:i%3===0 });
  }
}
function stepWalkers(dt){
  if (state.net.size !== walkerNetSize) reseedWalkers();
  for (const w of walkers){
    w.t += w.spd*dt;
    while (w.t >= 1){
      w.t -= 1;
      const nb = netNeighbors(w.tx,w.ty);
      let opts = nb.filter(([x,y]) => !(x===w.px && y===w.py));
      if (!opts.length) opts = nb;
      if (!opts.length){ w.t = 0; break; }
      const nxt = opts[(Math.random()*opts.length)|0];
      w.px = w.tx; w.py = w.ty; w.fx = w.tx; w.fy = w.ty;
      w.tx = nxt[0]; w.ty = nxt[1];
    }
  }
}
function drawWalker(w){
  const a = iso(w.fx,w.fy), b2 = iso(w.tx,w.ty);
  const x = a.x+(b2.x-a.x)*w.t, y = a.y+(b2.y-a.y)*w.t;
  const bob = Math.abs(Math.sin(w.t*Math.PI))*1.5;
  const leg = Math.sin(w.t*Math.PI*2+w.ph)*1.7;
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.beginPath(); ctx.ellipse(x, y+.8, 3, 1.4, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = w.col; ctx.lineWidth = 1.9; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x-leg, y); ctx.lineTo(x, y-bob-2.4); ctx.lineTo(x+leg, y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x, y-bob-2.4); ctx.lineTo(x, y-bob-6.6); ctx.stroke();
  ctx.lineCap = 'butt';
  ctx.fillStyle = '#E5C6A3';
  ctx.beginPath(); ctx.arc(x, y-bob-8.1, 1.7, 0, 7); ctx.fill();
  if (w.hat){
    ctx.fillStyle = 'rgba(20,28,32,.85)';
    ctx.beginPath(); ctx.arc(x, y-bob-8.4, 1.9, Math.PI, 0); ctx.fill();
  }
}

function stepBirds(dt){
  const t = now();
  if (!reduceMotion && !birds.length && t > nextFlock && state.bounds){
    const b = state.bounds, dir = Math.random() < .5 ? 1 : -1;
    const mem = [];
    const n = 3+((Math.random()*3)|0);
    for (let i=0;i<n;i++) mem.push({ dx:-dir*(i*15+Math.random()*9),
      dy:(Math.random()-.5)*30, ph:Math.random()*7 });
    birds.push({ x: dir>0 ? b.x0-320 : b.x1+320,
      y: b.y0-110-Math.random()*100, vx: dir*(34+Math.random()*18), mem });
    nextFlock = t+16000+Math.random()*20000;
  }
  for (const f of birds) f.x += f.vx*dt;
  if (state.bounds)
    birds = birds.filter(f => f.x > state.bounds.x0-560 && f.x < state.bounds.x1+560);
}
function drawBirds(){
  if (reduceMotion) return;
  const t = now();
  ctx.strokeStyle = 'rgba(206,218,222,.75)'; ctx.lineWidth = 1.2; ctx.lineCap = 'round';
  for (const f of birds) for (const m of f.mem){
    const wx = f.x+m.dx, wy = f.y+m.dy+Math.sin(t/700+m.ph)*4;
    const fl = Math.sin(t/95+m.ph*5)*2.8;
    ctx.beginPath();
    ctx.moveTo(wx-5, wy-fl);
    ctx.quadraticCurveTo(wx-2, wy+fl*.35, wx, wy);
    ctx.quadraticCurveTo(wx+2, wy+fl*.35, wx+5, wy-fl);
    ctx.stroke();
  }
  ctx.lineCap = 'butt';
}

/* Wolkenschatten wandern über die Stadt; die Formen stehen einmal fest,
   die Position ergibt sich aus einer Modulo-Fahrt zwischen den Weltgrenzen. */
function drawCloudShadows(){
  const b = state.bounds; if (!b) return;
  const span = (b.x1-b.x0)+1040, t = now()/1000;
  ctx.fillStyle = 'rgba(3,9,13,.13)';
  for (const c of clouds){
    const drift = reduceMotion ? 0 : t*c.sp;
    const cx = b.x0-520 + (((c.off+drift) % span) + span) % span;
    const cy = b.y0 + c.fy*(b.y1-b.y0);
    ctx.beginPath();
    for (const bl of c.blobs){
      ctx.moveTo(cx+bl.ox+bl.r, cy+bl.oy);
      ctx.arc(cx+bl.ox, cy+bl.oy, bl.r, 0, 7);
    }
    ctx.fill();
  }
}

/* Die Fahne am Rathaus ist das eine Teil, das nicht eingefroren im Sprite
   steht — ein Sinusband am Mastknäufchen. */
function drawPennant(px, py){
  ctx.beginPath();
  if (reduceMotion){
    ctx.moveTo(px,py+1); ctx.lineTo(px+12,py+3); ctx.lineTo(px,py+5);
  } else {
    const t = now()/620, segs = 5, amp = 1.8, L = 13.5;
    const top = [], bot = [];
    for (let i=0;i<=segs;i++){
      const u = i/segs;
      top.push([px+u*L, py+1+u*1.1+Math.sin(t+u*4.2)*amp*u]);
      bot.push([px+u*L, py+4.2+u*1.1+Math.sin(t+u*4.2+.85)*amp*u]);
    }
    ctx.moveTo(top[0][0],top[0][1]);
    for (const q of top) ctx.lineTo(q[0],q[1]);
    for (let i=segs;i>=0;i--) ctx.lineTo(bot[i][0],bot[i][1]);
  }
  ctx.closePath();
  ctx.fillStyle = '#E9AC39'; ctx.fill();
  ctx.strokeStyle = 'rgba(122,76,15,.5)'; ctx.lineWidth = .7; ctx.stroke();
}

function drawEffects(){
  const t = now();
  state.puffs = state.puffs.filter(p => t-p.t < 620);
  for (const p of state.puffs){
    const k = (t-p.t)/620;
    ctx.globalAlpha = (1-k)*0.4; ctx.fillStyle = '#9FB0A8';
    ctx.beginPath(); ctx.arc(p.x, p.y-k*26, p.r*(1+k*1.6), 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  state.floats = state.floats.filter(f => t-f.t < 1150);
  ctx.font = '600 16px "IBM Plex Mono", monospace'; ctx.textAlign = 'center';
  for (const f of state.floats){
    const k = (t-f.t)/1150;
    ctx.globalAlpha = 1-k*k; ctx.fillStyle = '#F2B035';
    ctx.shadowColor = 'rgba(242,176,53,.6)'; ctx.shadowBlur = 10;
    ctx.fillText(f.text, f.x, f.y-k*40); ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;
}

/* Scherung statt Drehung: der Versatz wächst mit dem Abstand zum Boden, also
   stehen die Wurzeln still und die Krone wiegt sich. Zwei überlagerte
   Schwingungen und ein Versatz je Feld verhindern Gleichtakt. Kosten: eine
   Matrix vor dem ohnehin nötigen drawImage — kein Sprite, kein Zeichenaufruf. */
function swayOf(t, phase){
  return t.sway * (Math.sin(windT + phase) + 0.32*Math.sin(windT*2.46 + phase*1.7)) * wind * 34;
}

function frame(){
  const tNow = now();
  let dt = (tNow-lastFrame)/1000; lastFrame = tNow;
  if (dt > .05) dt = .05; if (dt < 0) dt = 0;

  // Böen schwellen langsam an und ab; ein Sinus für die ganze Karte
  windT = tNow/1500;
  wind = reduceMotion ? 0 : (0.62 + 0.38*Math.sin(tNow/4300)) * 0.05;

  /* Tageszeit: dayS ist geglättet 1 mittags und 0 mitternachts, nightF das
     Gegenstück. Bei reduzierter Bewegung bleibt es Nachmittagslicht. */
  const dayRaw = reduceMotion ? 0.55 : ((tNow/DAY_CYCLE)+dayOffset)%1;
  dayF = 0.5-0.5*Math.cos(dayRaw*Math.PI*2);
  dayS = dayF*dayF*(3-2*dayF);
  nightF = 1-dayS;

  ctx.save();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  sky = paintSky();
  ctx.fillStyle = sky; ctx.fillRect(0,0,W,H);

  // Sterne nur nachts, zwei Ebenen gegenläufig
  if (starA && nightF > 0.02){
    const na = Math.pow(nightF,1.4);
    ctx.globalAlpha = (reduceMotion?.8:.68+.32*Math.sin(tNow/1700))*na;
    ctx.drawImage(starA,0,0,W,H);
    ctx.globalAlpha = (reduceMotion?.8:.68+.32*Math.cos(tNow/2300))*na;
    ctx.drawImage(starB,0,0,W,H);
    ctx.globalAlpha = 1;
  }
  drawCelestial(dayRaw);

  // Sternschnuppe: selten, flüchtig und nur bei Nacht
  if (!reduceMotion && nightF > 0.5){
    if (!shoot && tNow > nextShoot){
      shoot = { sx:W*(.12+Math.random()*.6), sy:H*(.05+Math.random()*.18),
                vx:(Math.random()<.5?-1:1)*(430+Math.random()*260),
                vy:170+Math.random()*90, t0:tNow, dur:820 };
    } else if (shoot){
      const k = (tNow-shoot.t0)/shoot.dur;
      if (k >= 1){ shoot = null; nextShoot = tNow+12000+Math.random()*20000; }
      else {
        const m2 = Math.hypot(shoot.vx,shoot.vy), ux = shoot.vx/m2, uy = shoot.vy/m2;
        const hx = shoot.sx+shoot.vx*k*shoot.dur/1000,
              hy = shoot.sy+shoot.vy*k*shoot.dur/1000;
        const tail = 140*(1-k*.55);
        const gr = ctx.createLinearGradient(hx,hy,hx-ux*tail,hy-uy*tail);
        gr.addColorStop(0,'rgba(238,244,240,'+(.85*(1-k)).toFixed(3)+')');
        gr.addColorStop(1,'rgba(238,244,240,0)');
        ctx.strokeStyle = gr; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(hx,hy); ctx.lineTo(hx-ux*tail,hy-uy*tail); ctx.stroke();
        ctx.lineCap = 'butt';
      }
    }
  }
  ctx.restore();

  ctx.save();
  const z = DPR*cam.z;
  ctx.setTransform(z, 0, 0, z, DPR*(W/2 - cam.x*cam.z), DPR*(H/2 - cam.y*cam.z));
  drawGround();
  drawOffers();
  drawCloudShadows();
  stepWalkers(dt);
  stepBirds(dt);
  const visB = viewBox(210);
  const list = [];
  for (const b of state.tiles.values()){
    if (b.type === 'road') continue;
    if (!inBox(iso(b.x,b.y), visB)) continue;
    list.push(b);
  }
  /* Gebäude und Passanten gemeinsam in Tiefenordnung bringen — wer südlicher
     steht, deckt ab, ganz gleich ob Haus oder Fuß. */
  const items = [];
  for (const b of list) items.push({ d:b.x+b.y, f:() => drawBuilding(b,false) });
  const visW = viewBox(40);
  for (const w of walkers){
    if (!inBox(iso((w.fx+w.tx)/2,(w.fy+w.ty)/2), visW)) continue;
    items.push({ d:(w.fx+w.fy+w.tx+w.ty)/2+.02, f:() => drawWalker(w) });
  }
  items.sort((a,b)=>a.d-b.d);
  for (const it of items) it.f();
  if (state.hover && TYPES[state.tool] && !at(state.hover.x,state.hover.y) && state.tool!=='road'){
    drawBuilding({x:state.hover.x,y:state.hover.y,type:state.tool,level:0,born:0,conn:true},true);
  }
  // Angehobenes Gebäude als Vorschau am Zielfeld
  if (state.moving && state.hover && !at(state.hover.x,state.hover.y)){
    const src = at(state.moving.x, state.moving.y);
    if (src){
      // leicht angehoben zeichnen, damit die Vorschau wie getragen wirkt
      ctx.save(); ctx.translate(0, -5);
      drawBuilding({ ...src, x:state.hover.x, y:state.hover.y, born:0 }, true);
      ctx.restore();
    }
  }
  drawBirds();
  drawEffects();
  ctx.restore();

  /* Tageslicht über allem Weltlichen: warmes Licht am Tag, blaue Tiefe nachts */
  if (dayS > 0.01){
    ctx.fillStyle = 'rgba(255,238,205,'+(0.15*dayS).toFixed(3)+')';
    ctx.fillRect(0,0,cv.width,cv.height);
  }
  if (nightF > 0.01){
    ctx.fillStyle = 'rgba(12,22,42,'+(0.20*nightF).toFixed(3)+')';
    ctx.fillRect(0,0,cv.width,cv.height);
  }

  // Die Hilfeseite nutzt dieselbe Schleife — aber nur, solange sie offen ist
  if (helpCards.length && !helpEl.hidden) paintHelpCards();

  requestAnimationFrame(frame);
}

/* ============================================================
   9. EINGABE
============================================================ */
const pointers = new Map();
let gesture = null, holdTimer = null;
const TAP_SLOP = 8;          // ab dieser Bewegung ist es kein Tippen mehr
const HOLD_MS  = 380;        // so lange halten, um ein Gebäude aufzunehmen

function cancelHold(){ clearTimeout(holdTimer); holdTimer = null; }

/* Langdruck: aus dem Tippen wird ein Tragen. Das Gebäude hängt danach am
   Zeiger, bis es losgelassen wird — unabhängig vom gewählten Werkzeug. */
function startCarry(gs){
  if (!gs || gs.mode !== 'tap' || !gs.holdAt) return;
  const b = at(gs.holdAt.x, gs.holdAt.y);
  if (!b || TYPES[b.type].fixed) return;
  gs.mode = 'carry';
  state.moving = { x:b.x, y:b.y };
  state.hover  = { x:b.x, y:b.y };
  try { if (typeof navigator !== 'undefined' && navigator.vibrate) navigator.vibrate(12); } catch (e){}
  flash(stageOf(b).name + ' aufgenommen \u2014 auf ein freies Feld ziehen.');
}

function localXY(ev){
  const r = cv.getBoundingClientRect();
  return { x: ev.clientX - r.left, y: ev.clientY - r.top };
}
function toGrid(ev){
  const l = localXY(ev);
  const g = toTile(l.x, l.y);
  if (!unlocked(g.x,g.y)) return null;
  return g;
}
const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);

/* ---- Tippen auswerten (Bauen, Kassieren, Ausbauen, Abreißen) ---- */
function buyPlot(k){
  const price = plotPrice();
  if (state.free > 0)
    return flash('Erst alles bebauen — noch ' + state.free + ' freie Felder.');
  if (state.coins < price)
    return flash('Bauabschnitt kostet ' + price.toLocaleString('de-DE') + ' Münzen.');
  state.coins -= price;
  state.plots.add(k);
  rebuildWorld();
  const [sx,sy] = k.split(',').map(Number);
  for (let i=0;i<P;i++) puff(sx*P+i, sy*P+(i%2?0:P-1));
  flash('Bauabschnitt gekauft — ' + (P*P) + ' neue Felder.');
  refresh();
}

function tap(ev){
  const l = localXY(ev);
  const raw = toTile(l.x, l.y);
  if (!unlocked(raw.x, raw.y)){
    const k = plotKey(raw.x, raw.y);
    if (offers().some(o => o.k === k)) buyPlot(k);
    return;
  }
  const g = raw;
  const b = at(g.x,g.y);

  // Etwas in der Hand? Dann setzt jeder Tipp es ab, gleich welches Werkzeug.
  // Sonst käme man aus dem Tragen nur noch über Escape wieder heraus.
  if (state.moving){ moveTo(g.x, g.y); return; }

  // Reines Ernten: sammelt nur ein und baut nie versehentlich etwas
  if (state.tool==='harvest'){
    if (!b) return flash('Leeres Feld — hier gibt es nichts zu ernten.');
    if (isReady(b)) return collect(b);
    if (!b.conn) return flash(stageOf(b).name + ' hat keinen Weg zum Rathaus.');
    if (!b.staffed) return flash(stageOf(b).name + ' steht still: ' +
      stageOf(b).staff + ' Einwohner nötig, ' + freePop() + ' frei.');
    return flash(stageOf(b).time ? stageOf(b).name + ' produziert noch.'
      : TYPES[b.type].aura
        ? TYPES[b.type].label + ' verstärkt nur die Nachbarn — nichts zu ernten.'
        : stageOf(b).name + ' wirft nichts ab.');
  }

  // Verschieben: anheben (das Absetzen erledigt der Zweig oben)
  if (state.tool==='move'){
    if (b) pickUp(b); else flash('Hier steht nichts zum Verschieben.');
    return;
  }

  if (state.tool==='raze'){ b ? demolish(b) : flash('Hier steht nichts.'); return; }
  if (state.tool==='lift'){ b ? upgrade(b) : flash('Erst bauen, dann ausbauen.'); return; }
  if (b){
    if (isReady(b)) collect(b);
    else if (!b.conn) flash(stageOf(b).name + ' hat keinen Weg zum Rathaus.');
    else if (!b.staffed) flash(stageOf(b).name + ' steht still: ' +
      stageOf(b).staff + ' Einwohner nötig, ' + freePop() + ' frei.');
    else if (stageOf(b).time===0) flash(TYPES[b.type].aura
      ? TYPES[b.type].label + ': +' + Math.round(TYPES[b.type].aura*100) +
        ' % Ertrag auf die vier Nachbarfelder.'
      : 'Straße.');
    else flash(stageOf(b).name + ' produziert noch.');
    return;
  }
  build(g.x,g.y,state.tool);
}

/* ---- Zeiger: ein Finger baut oder schiebt, zwei Finger zoomen ---- */
cv.addEventListener('pointerdown', ev => {
  cv.setPointerCapture(ev.pointerId);
  pointers.set(ev.pointerId, { x:ev.clientX, y:ev.clientY });
  state.hover = toGrid(ev);

  if (pointers.size === 2){
    cancelHold();
    const [a,b] = [...pointers.values()];
    gesture = { mode:'pinch', d:dist(a,b), mx:(a.x+b.x)/2, my:(a.y+b.y)/2 };
    return;
  }
  if (pointers.size > 2) return;

  if (ev.button === 1 || ev.shiftKey){          // Mittlere Taste oder Umschalt schiebt
    gesture = { mode:'pan', lx:ev.clientX, ly:ev.clientY };
    return;
  }
  const g = toGrid(ev);
  if (state.tool === 'road' && g && !at(g.x,g.y)){
    gesture = { mode:'paint' };
    build(g.x, g.y, 'road');
    return;
  }
  gesture = { mode:'tap', sx:ev.clientX, sy:ev.clientY };

  // Liegt hier ein bewegliches Gebäude, läuft die Haltezeit an
  const held = g && at(g.x, g.y);
  if (held && !TYPES[held.type].fixed && state.tool !== 'raze' && !state.moving){
    gesture.holdAt = { x:g.x, y:g.y };
    const gs = gesture;
    holdTimer = setTimeout(() => startCarry(gs), HOLD_MS);
  }
});

cv.addEventListener('pointermove', ev => {
  const p = pointers.get(ev.pointerId);
  if (p){ p.x = ev.clientX; p.y = ev.clientY; }
  if (ev.pointerType === 'mouse' && (!gesture || gesture.mode === 'tap')) state.hover = toGrid(ev);
  if (gesture && gesture.mode === 'carry') state.hover = toGrid(ev);   // auch mit dem Finger
  if (!gesture) return;

  if (gesture.mode === 'pinch'){
    if (pointers.size < 2) return;
    const [a,b] = [...pointers.values()];
    const d = dist(a,b), mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
    cam.x -= (mx - gesture.mx)/cam.z;
    cam.y -= (my - gesture.my)/cam.z;
    const r = cv.getBoundingClientRect();
    if (gesture.d > 0) zoomAt(mx - r.left, my - r.top, d/gesture.d);
    gesture.d = d; gesture.mx = mx; gesture.my = my;
    clampCam();
    return;
  }
  if (gesture.mode === 'paint'){
    const g = toGrid(ev);
    if (g && !at(g.x,g.y)) build(g.x, g.y, 'road');
    return;
  }
  if (gesture.mode === 'carry') return;
  if (gesture.mode === 'tap'){
    if (Math.hypot(ev.clientX-gesture.sx, ev.clientY-gesture.sy) < TAP_SLOP) return;
    cancelHold();                                            // war doch nur ein Wischen
    gesture = { mode:'pan', lx:gesture.sx, ly:gesture.sy };   // aus Tippen wird Schieben
    state.hover = null;
  }
  if (gesture.mode === 'pan'){
    cam.x -= (ev.clientX - gesture.lx)/cam.z;
    cam.y -= (ev.clientY - gesture.ly)/cam.z;
    gesture.lx = ev.clientX; gesture.ly = ev.clientY;
    clampCam();
  }
});

function endPointer(ev){
  const had = gesture;
  cancelHold();
  pointers.delete(ev.pointerId);

  if (had && had.mode === 'carry'){
    const g = toGrid(ev);
    if (g && state.moving && (g.x !== state.moving.x || g.y !== state.moving.y)) moveTo(g.x, g.y);
    else flash('In der Hand \u2014 Zielfeld antippen, Escape legt ab.');
    gesture = null;
    if (ev.pointerType !== 'mouse') state.hover = null;
    return;
  }
  if (had && had.mode === 'tap') tap(ev);
  if (pointers.size === 0){ gesture = null; if (ev.pointerType !== 'mouse') state.hover = null; }
  else if (had && had.mode === 'pinch' && pointers.size === 1){
    const [a] = [...pointers.values()];
    gesture = { mode:'pan', lx:a.x, ly:a.y };
  }
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('pointerleave', ev => { if (ev.pointerType === 'mouse' && !gesture) state.hover = null; });

/* ---- Mausrad ---- */
cv.addEventListener('wheel', ev => {
  ev.preventDefault();
  const l = localXY(ev);
  const step = ev.deltaMode === 1 ? ev.deltaY*16 : ev.deltaY;
  zoomAt(l.x, l.y, Math.max(0.8, Math.min(1.25, Math.exp(-step*0.0018))));
}, { passive:false });

/* ---- Tastatur ---- */
addEventListener('keydown', ev => {
  if (ev.target !== document.body) return;
  const pan = 60/cam.z;
  if (ev.key === '+' || ev.key === '=') zoomAt(W/2, H/2, 1.25);
  else if (ev.key === '-' || ev.key === '_') zoomAt(W/2, H/2, 0.8);
  else if (ev.key === '0') resetView();
  else if (ev.key === '?' || ev.key === 'h') toggleHelp(helpEl.hidden);
  else if (ev.key === 'Escape'){
    if (!helpEl.hidden) toggleHelp(false);
    else if (state.moving){ state.moving = null; flash('Verschieben abgebrochen.'); }
    else return;
  }
  else if (ev.key === 'ArrowLeft')  cam.x -= pan;
  else if (ev.key === 'ArrowRight') cam.x += pan;
  else if (ev.key === 'ArrowUp')    cam.y -= pan;
  else if (ev.key === 'ArrowDown')  cam.y += pan;
  else return;
  clampCam(); ev.preventDefault();
});

/* ============================================================
   SPEICHERN
   Die Datei läuft in ganz verschiedenen Umgebungen: als Artefakt,
   lokal per Doppelklick, auf einem Webserver, in einem abgeschotteten
   Rahmen. Deshalb wird kein Speicher vorausgesetzt, sondern der beste
   verfügbare gesucht — und notfalls bleibt der Weg über eine Datei.
============================================================ */
const SAVE_KEY = 'iso-stadt-v1';

const Store = {
  mode: 'kein',
  async init(){
    try {
      if (typeof window !== 'undefined' && window.storage &&
          typeof window.storage.get === 'function'){ this.mode = 'artefakt'; return; }
    } catch (e){}
    try {
      const t = '__probe__';
      window.localStorage.setItem(t,'1'); window.localStorage.removeItem(t);
      this.mode = 'browser';
    } catch (e){ this.mode = 'kein'; }
  },
  async read(){
    try {
      if (this.mode === 'artefakt'){ const r = await window.storage.get(SAVE_KEY); return r ? r.value : null; }
      if (this.mode === 'browser') return window.localStorage.getItem(SAVE_KEY);
    } catch (e){}
    return null;
  },
  async write(str){
    try {
      if (this.mode === 'artefakt'){ await window.storage.set(SAVE_KEY, str); return true; }
      if (this.mode === 'browser'){ window.localStorage.setItem(SAVE_KEY, str); return true; }
    } catch (e){}
    return false;
  },
  async wipe(){
    try {
      if (this.mode === 'artefakt') await window.storage.delete(SAVE_KEY);
      if (this.mode === 'browser') window.localStorage.removeItem(SAVE_KEY);
    } catch (e){}
  }
};

/* Der Spielstand als kurze Liste. Zeiten werden als Restdauer abgelegt,
   nicht als Zeitpunkt — sonst wäre nach einer Woche Pause alles fertig
   und der Spielstand hinge an der Systemuhr. */
function serialize(){
  const t = now();
  return JSON.stringify({
    v: 1,
    c: state.coins,
    p: [...state.plots],
    t: [...state.tiles.values()].map(b => [
      b.x, b.y, b.type, b.level,
      Math.max(0, Math.round((b.paused != null ? b.paused : b.done - t))),
      b.paused != null ? 1 : 0,
      b.invested || 0
    ])
  });
}

function deserialize(str){
  const d = JSON.parse(str);
  if (!d || d.v !== 1 || !Array.isArray(d.t) || !Array.isArray(d.p))
    throw new Error('Das ist kein Spielstand dieser Fassung.');

  const t = now();
  const plots = new Set(d.p.filter(k => /^-?\d+,-?\d+$/.test(k)));
  if (!plots.size) throw new Error('Der Spielstand enthält keine Bauabschnitte.');

  state.coins = Math.max(0, Number(d.c) || 0);
  state.plots = plots;
  state.moving = null;
  state.tiles = new Map();
  rebuildWorld();

  d.t.forEach(([x, y, type, level, rest, isPaused, invested], i) => {
    const T = TYPES[type];
    if (!T || !T.stages[level] || !unlocked(x, y) || at(x, y)) return;   // Unbekanntes still übergehen
    state.tiles.set(key(x, y), {
      x, y, type, level,
      conn: false, staffed: false, active: false,
      paused: isPaused ? Math.max(0, rest) : null,
      done: t + Math.max(0, rest),
      invested: Math.max(0, invested) || T.cost,
      born: t - 1e6 + i          // weit in der Vergangenheit, Reihenfolge bleibt erhalten
    });
  });

  if (![...state.tiles.values()].some(b => b.type === 'hall')) placeHall();
  refresh();
}

function placeHall(){
  state.tiles.set(key(3,3), { x:3, y:3, type:'hall', level:0, conn:true, staffed:true,
    active:true, paused:null, invested:0,
    done: now() + TYPES.hall.stages[0].time*1000, born:0 });
}

let loading = false, saveTimer = null, savedAt = 0;

function scheduleSave(){
  if (loading || Store.mode === 'kein') return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 1200);
}
async function saveNow(){
  if (loading || Store.mode === 'kein') return false;
  const okSave = await Store.write(serialize());
  if (okSave){ savedAt = now(); paintSaveState(); }
  return okSave;
}

function newCity(){
  state.coins = 220;
  state.tiles = new Map();
  state.plots = new Set(['0,0','1,0','0,1','1,1']);
  state.floats = []; state.puffs = []; state.moving = null;
  rebuildWorld();
  placeHall();
  refresh();
  resetView();
}

async function bootSave(){
  await Store.init();
  loading = true;
  let restored = false;
  const raw = await Store.read();
  // Nur laden, solange niemand schon gebaut hat — sonst würde ein Klick
  // in den ersten Millisekunden vom alten Stand überschrieben.
  const untouched = state.tiles.size === 1 && state.coins === 220;
  if (raw && untouched){
    try { deserialize(raw); resetView(); restored = true; }
    catch (e){ console.warn('Spielstand unlesbar:', e.message); }
  }
  loading = false;
  paintSaveState();
  if (restored) flash('Stadt fortgesetzt.');
}

/* ---- Sichern und Laden über eine Datei: geht in jeder Umgebung ---- */
function exportFile(){
  const data = serialize();
  try {
    const url = URL.createObjectURL(new Blob([data], {type:'application/json'}));
    const a = document.createElement('a');
    a.href = url;
    a.download = 'iso-stadt-' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    flash('Spielstand als Datei gesichert.');
  } catch (e){
    showText(data);
    flash('Herunterladen nicht möglich — hier ist der Sicherungstext.');
  }
}

function importFile(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json,.json,.txt';
  inp.addEventListener('change', () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => loadText(String(r.result));
    r.readAsText(f);
  });
  inp.click();
}

function loadText(str){
  try {
    loading = true; deserialize(str.trim()); resetView(); loading = false;
    saveNow(); flash('Stadt geladen.');
  } catch (e){
    loading = false;
    flash('Konnte nicht geladen werden: ' + e.message);
  }
}

const helpEl = document.getElementById('help');

/* Alle Karten einer Reihe teilen sich Maßstab und Standlinie — nur so ist
   der Größenzuwachs von Stufe zu Stufe überhaupt ablesbar. */
let cardSeq = 0;
const helpCards = [];   // was auf der Hilfeseite bewegt werden muss

/* Eine Karte wird aus demselben Sprite gezeichnet wie das Spielfeld und
   bekommt dieselben Bewegungen: Wind, Pulsieren, Rauch. */
function renderCard(e){
  const { g, view, type, level, phase } = e;
  const sp = sprite(type, level, 'lit');
  const baseY = view.h - 44;

  g.setTransform(e.dpr*view.scale, 0, 0, e.dpr*view.scale, 0, 0);
  g.clearRect(0, 0, view.w, view.h);
  g.strokeStyle = 'rgba(140,160,168,.22)'; g.lineWidth = 1/view.scale;
  g.beginPath(); g.moveTo(8, baseY); g.lineTo(view.w-8, baseY); g.stroke();

  g.save();
  g.translate(view.w/2, baseY);
  const t = TYPES[type];
  if (wind && t.tree) g.transform(1, 0, swayOf(t, phase), 1, 0, 0);
  if (!reduceMotion && t.stages[level].time > 0){
    const pulse = 0.5 + 0.5*Math.sin(now()/380 + phase);
    g.shadowColor = 'rgba(242,176,53,' + (0.22 + pulse*0.3) + ')';
    g.shadowBlur = 10 + pulse*10;
  }
  g.drawImage(sp.cv, -sp.ax, -sp.ay, sp.w, sp.h);
  g.restore();

  if (sp.smoke && !reduceMotion)
    puffSmoke(g, view.w/2 + sp.smoke[0], baseY + sp.smoke[1], phase);
}

function paintHelpCards(){
  for (const e of helpCards) renderCard(e);
}

function stepCard(type, level, view, num){
  const st = TYPES[type].stages[level];
  const c = document.createElement('canvas');
  const dpr = Math.min(2, DPR);
  const cw = view.w*view.scale, chh = view.h*view.scale;
  c.width = Math.round(cw*dpr); c.height = Math.round(chh*dpr);
  c.style.width = Math.round(cw)+'px';
  c.style.height = Math.round(chh)+'px';

  const entry = { g:c.getContext('2d'), view, type, level, dpr,
                  phase: helpCards.length * 0.9 };
  helpCards.push(entry);
  renderCard(entry);

  const d = document.createElement('div');
  d.className = 'step';
  if (num){
    const nn = document.createElement('div');
    nn.className = 'num'; nn.textContent = 'Stufe ' + num;
    d.appendChild(nn);
  }
  d.appendChild(c);
  const lines = [];
  if (st.time) lines.push('<em>'+st.yield.toLocaleString('de-DE')+'</em> / '+st.time+' s');
  if (st.time) lines.push(Math.round(st.yield*60/st.time).toLocaleString('de-DE')+' pro Min.');
  if (st.pop)  lines.push('<i>+'+st.pop+' Einwohner</i>');
  if (st.staff) lines.push('<i>'+st.staff+' Einwohner nötig</i>');
  if (TYPES[type].aura) lines.push('<i>+'+Math.round(TYPES[type].aura*100)+' % Nachbarn</i>');
  if (level === 0 && TYPES[type].cost) lines.push('Bau: '+TYPES[type].cost.toLocaleString('de-DE'));
  if (st.upgrade) lines.push('Ausbau: '+st.upgrade.toLocaleString('de-DE'));
  const tag = document.createElement('div');
  tag.innerHTML = '<div class="sn">'+st.name+'</div><div class="sd">'+lines.join('<br>')+'</div>';
  d.appendChild(tag);
  return d;
}

function chainOf(items, numbered){
  const boxes = items.map(([t,l]) => spriteBox(t,l));
  const view = {
    w: Math.max(...boxes.map(b=>b.w)),
    h: Math.max(...boxes.map(b=>b.h))
  };
  view.scale = Math.min(150/view.h, 108/view.w);
  const row = document.createElement('div');
  row.className = 'chain';
  items.forEach(([t,l],i) => {
    if (i && numbered){
      const sep = document.createElement('div');
      sep.className = 'sep'; sep.textContent = '\u203A';
      row.appendChild(sep);
    }
    row.appendChild(stepCard(t, l, view, numbered ? i+1 : 0));
  });
  return row;
}
const chain = type => chainOf(TYPES[type].stages.map((_,i)=>[type,i]), true);

/* ============================================================
   10. OBERFLÄCHE
============================================================ */
const tray = document.getElementById('tray'), tipEl = document.getElementById('tip');
let tipTimer = null;
const TOOLS = [
  {id:'harvest', name:'Geld ernten', square:true},
  ...['road','hut','shop','well','tree1','tree2'].map(k=>({id:k,name:TYPES[k].label,type:TYPES[k]})),
  {id:'move',name:'Verschieben',util:true,hint:'ohne Verlust'},
  {id:'lift',name:'Ausbauen',util:true,hint:'mehr, aber langsamer'},
  {id:'raze',name:'Abreißen',util:true,hint:'50 % zurück'}
];
for (const tool of TOOLS){
  const btn = document.createElement('button');
  btn.className = 'card' + (tool.square ? ' sq' : tool.util ? ' util' : '');
  btn.dataset.id = tool.id;
  btn.setAttribute('aria-pressed', String(state.tool===tool.id));
  if (tool.square){
    btn.title = tool.name;
    btn.setAttribute('aria-label', tool.name);
    btn.innerHTML = '<span class="g"></span><span class="n">Ernten</span>';
  } else if (tool.util){
    btn.innerHTML = '<span class="n">'+tool.name+'</span><span class="m">'+tool.hint+'</span>';
  } else {
    const s = tool.type.stages[0];
    const line = tool.type.isRoad ? 'verbindet zum Rathaus'
      : tool.type.aura ? '+'+Math.round(tool.type.aura*100)+'% Nachbarn'
      : s.yield+' / '+s.time+' s';
    const extra = s.staff ? '<br>'+s.staff+' Einwohner'
                : s.pop   ? '<br>+'+s.pop+' Einwohner' : '';
    btn.innerHTML = '<span class="n">'+tool.name+'</span>'+
      '<span class="m"><em>'+tool.type.cost+'</em> Münzen<br>'+line+extra+'</span>';
  }
  btn.addEventListener('click', () => {
    state.tool = tool.id;
    state.moving = null;              // Werkzeugwechsel legt das Gebäude wieder ab
    for (const el of tray.children) el.setAttribute('aria-pressed', String(el.dataset.id===tool.id));
    flash(tool.id==='move' ? 'Verschieben: Gebäude antippen, dann ein freies Feld.'
      : tool.id==='harvest' ? 'Ernten: nur fertige Gebäude einsammeln, nichts wird gebaut.'
      : tool.id==='road' ? 'Straße: ziehen, um mehrere Felder zu pflastern.'
      : tool.util ? tool.name+': Gebäude antippen.' : tool.name+' gewählt — freies Feld antippen.');
  });
  tray.appendChild(btn);
}
function flash(msg){
  tipEl.textContent = msg; tipEl.style.opacity = '1';
  clearTimeout(tipTimer); tipTimer = setTimeout(()=>{tipEl.style.opacity='.45';},2600);
}
function refresh(){
  state.net = computeNetwork();
  const list = [...state.tiles.values()].filter(b => b.type !== 'road');

  // 1. Straßenanschluss prüfen und den verfügbaren Wohnraum zählen
  let total = 0;
  for (const b of list){
    b.conn = isConnected(b);
    if (b.conn) total += stageOf(b).pop || 0;
  }

  // 2. Werkstätten der Reihe nach besetzen — die ältesten behalten ihre Leute
  let used = 0;
  for (const b of [...list].sort((x,y) => x.born - y.born)){
    const need = stageOf(b).staff || 0;
    if (!need){ b.staffed = true; continue; }
    b.staffed = b.conn && used + need <= total;
    if (b.staffed) used += need;
  }
  state.pop = { total, used };

  // 3. Produktion anhalten oder dort fortsetzen, wo sie stehengeblieben ist
  let perMin = 0, idle = 0;
  for (const b of list){
    const was = b.active, active = b.conn && b.staffed;
    if (was && !active) b.paused = Math.max(0, b.done - now());
    else if (!was && active && b.paused != null){ b.done = now() + b.paused; b.paused = null; }
    b.active = active;
    const st = stageOf(b);
    if (st.time > 0){ if (active) perMin += payout(b)*(60/st.time); else idle++; }
  }

  state.free = state.cells.length - state.tiles.size;

  const set = (id,val,warn) => {
    const el = document.getElementById(id);
    el.textContent = val;
    el.classList.toggle('warn', !!warn);
  };
  set('coins', state.coins.toLocaleString('de-DE'));
  set('pop', (total-used) + ' / ' + total, total-used < 0);
  set('rate', Math.round(perMin).toLocaleString('de-DE'));
  set('cut', idle, idle > 0);
  set('free', state.free, state.free === 0);

  for (const el of tray.children){
    const t = TYPES[el.dataset.id];
    el.classList.toggle('broke', !!t &&
      (state.coins < t.cost || (t.stages[0].staff||0) > total-used));
  }
  scheduleSave();
}

rebuildWorld();
placeHall();
resize(); resetView(); started = true; refresh();
requestAnimationFrame(frame);

addEventListener('pagehide', () => { clearTimeout(saveTimer); saveNow(); });
addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden'){ clearTimeout(saveTimer); saveNow(); }
});
