<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Iso-Stadt — Prototyp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0E1B24; --amber:#F2B035; --fog:#8CA0A8; --alarm:#C46A5C;
  --line:rgba(140,160,168,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--night);color:#E8EDEF;font-family:"IBM Plex Sans",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;touch-action:manipulation}
#c{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#vg{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(115% 90% at 50% 42%, transparent 54%, rgba(3,8,12,.5) 100%)}
.bar{position:fixed;top:0;left:0;right:0;z-index:2;display:flex;align-items:flex-start;
  justify-content:space-between;padding:18px 18px 0;gap:12px;pointer-events:none}
.purse{display:flex;align-items:center;gap:9px}
.coin{width:15px;height:15px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 32% 28%,#FFDE93,var(--amber) 62%,#B57C12);
  box-shadow:0 0 14px rgba(242,176,53,.45)}
#coins{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:30px;
  letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.purse .lbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--fog)}
.tally{text-align:right;font-size:11px;line-height:1.65;color:var(--fog)}
.tally b{font-family:"IBM Plex Mono",monospace;color:#E8EDEF;font-weight:600;font-variant-numeric:tabular-nums}
.tally b.warn{color:var(--alarm)}
.tray{position:fixed;left:0;right:0;bottom:0;z-index:2;
  padding:0 12px calc(14px + env(safe-area-inset-bottom));
  display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tray::-webkit-scrollbar{display:none}
.card{flex:none;min-width:112px;text-align:left;cursor:pointer;
  background:rgba(14,27,36,.82);backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:3px;padding:9px 11px 10px;color:inherit;font:inherit;
  transition:border-color .16s,background .16s,transform .16s}
.card:hover{border-color:rgba(242,176,53,.4)}
.card:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.card[aria-pressed="true"]{border-color:var(--amber);background:rgba(242,176,53,.1);transform:translateY(-3px)}
.card .n{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;font-size:14px;
  letter-spacing:-.01em;display:block;margin-bottom:3px}
.card .m{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--fog);display:block;line-height:1.5}
.card .m em{font-style:normal;color:var(--amber)}
.card.broke .m em{color:var(--alarm)}
.card.util{min-width:78px}.card.util .n{font-size:12px;margin:0}
.card.sq{min-width:62px;width:62px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:5px;padding:8px 4px;text-align:center}
.card.sq .n{font-size:11px;margin:0;line-height:1.15}
.card.sq .g{width:17px;height:17px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 32% 28%,#FFDE93,var(--amber) 62%,#B57C12);
  box-shadow:0 0 10px rgba(242,176,53,.4)}
.card.sq[aria-pressed="true"] .g{box-shadow:0 0 16px rgba(242,176,53,.75)}
.topActs{position:fixed;left:18px;top:74px;z-index:3;display:flex;gap:6px}
.topActs button{font:inherit;font-size:11px;letter-spacing:.02em;cursor:pointer;
  color:#CBD8DC;padding:6px 11px;background:rgba(14,27,36,.82);backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:3px;
  transition:border-color .16s,color .16s}
.topActs button:hover{border-color:rgba(242,176,53,.55);color:var(--amber)}
.topActs button:active{background:rgba(242,176,53,.12)}
.topActs button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
@media (max-width:520px){.topActs{top:64px}}
.zoom{position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:2;
  display:flex;flex-direction:column;gap:6px}
.zoom button{width:38px;height:38px;cursor:pointer;color:#CBD8DC;
  background:rgba(14,27,36,.82);backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:3px;
  font-family:"IBM Plex Mono",monospace;font-size:17px;line-height:1;
  transition:border-color .16s,color .16s}
.zoom button:hover{border-color:rgba(242,176,53,.5);color:#F2B035}
.zoom button:active{background:rgba(242,176,53,.12)}
.zoom button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.sheet{position:fixed;inset:0;z-index:9;background:rgba(6,13,18,.78);
  backdrop-filter:blur(6px);display:flex;justify-content:center;
  align-items:flex-start;overflow-y:auto;padding:0 0 60px}
.sheet[hidden]{display:none}
.sheetInner{width:min(760px,100%);background:#101E28;border:1px solid var(--line);
  border-radius:4px;margin:24px 14px}
.sheetTop{position:sticky;top:0;background:#101E28;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;padding:16px 18px;z-index:2}
.sheetTop h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;
  font-size:19px;letter-spacing:-.02em}
.sheetTop button{width:32px;height:32px;background:none;border:1px solid var(--line);
  border-radius:3px;color:var(--fog);cursor:pointer;font-size:14px}
.sheetTop button:hover{border-color:rgba(242,176,53,.5);color:var(--amber)}
.sheetBody{padding:6px 18px 26px}
.sheetBody h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;
  font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--amber);
  margin:26px 0 10px}
.sheetBody p{font-size:13px;line-height:1.65;color:#C3D0D5;margin:0 0 10px;max-width:62ch}
.sheetBody b{color:#E8EDEF;font-weight:500}
.chain{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px 0 8px}
.chain::-webkit-scrollbar{display:none}
.step{flex:none;width:126px;border:1px solid var(--line);border-radius:3px;
  background:#0C1922;padding:8px;text-align:center}
.step canvas{display:block;position:static;inset:auto;margin:0 auto;touch-action:auto}
/* Dieselbe Scherung wie im Spiel, nur vom Compositor erledigt:
   der Ursprung sitzt auf der Standlinie, unten bewegt sich also nichts. */
@keyframes sway{
  0%,100%{ transform:skewX(-2.4deg) }
  50%    { transform:skewX( 2.4deg) }
}
@keyframes cardGlow{
  0%,100%{ filter:drop-shadow(0 0 3px rgba(242,176,53,.22)) }
  50%    { filter:drop-shadow(0 0 10px rgba(242,176,53,.5)) }
}
.step canvas.sway{ animation:sway 5.4s ease-in-out infinite }
.step canvas.glow{ animation:cardGlow 2.8s ease-in-out infinite }
.step canvas.sway.glow{ animation:sway 5.4s ease-in-out infinite,
                                  cardGlow 2.8s ease-in-out infinite }
@media (prefers-reduced-motion:reduce){ .step canvas{ animation:none !important } }
.step .num{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--amber);margin-bottom:3px}
.sep{flex:none;align-self:center;color:rgba(242,176,53,.5);font-size:19px;line-height:1;
  padding:0 2px;user-select:none}
.scrollNote{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--fog);
  margin:-4px 0 2px;letter-spacing:.04em}
.step .sn{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;
  font-size:12px;margin-top:4px;letter-spacing:-.01em}
.step .sd{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--fog);
  line-height:1.55;margin-top:4px}
.step .sd em{font-style:normal;color:var(--amber)}
.step .sd i{font-style:normal;color:#8FC0D8}
.btnRow{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 4px}
.act{font:inherit;font-size:12px;cursor:pointer;color:#DCE5E8;padding:7px 12px;
  background:#0C1922;border:1px solid var(--line);border-radius:3px;
  transition:border-color .16s,color .16s}
.act:hover{border-color:rgba(242,176,53,.55);color:var(--amber)}
.act:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.act.warn:hover{border-color:rgba(196,106,92,.7);color:var(--alarm)}
.saveBox{width:100%;height:88px;margin-top:8px;resize:vertical;
  font-family:"IBM Plex Mono",monospace;font-size:10px;line-height:1.5;
  color:#C3D0D5;background:#0A141B;border:1px solid var(--line);
  border-radius:3px;padding:8px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px;
  color:#C3D0D5;margin:2px 0 4px;align-items:baseline}
.keys kbd{font-family:"IBM Plex Mono",monospace;font-size:11px;background:#0C1922;
  border:1px solid var(--line);border-radius:3px;padding:2px 6px;color:#E8EDEF;white-space:nowrap}
.flag{display:inline-block;width:9px;height:9px;transform:rotate(45deg);
  margin-right:6px;vertical-align:middle}
.tip{position:fixed;left:0;right:0;z-index:2;text-align:center;font-size:11.5px;
  color:var(--fog);pointer-events:none;padding:0 20px;transition:opacity .3s;
  bottom:calc(112px + env(safe-area-inset-bottom))}
@media (max-width:520px){#coins{font-size:24px}
  .tip{bottom:calc(108px + env(safe-area-inset-bottom))}}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vg" aria-hidden="true"></div>
<header class="bar">
  <div class="purse">
    <div class="coin"></div>
    <div><div id="coins">220</div><span class="lbl">Münzen</span></div>
  </div>
  <div class="tally">
    <div>Einwohner frei <b id="pop">0 / 0</b></div>
    <div>Ertrag/Min <b id="rate">0</b></div>
    <div>Stillstand <b id="cut">0</b></div>
    <div>Freie Felder <b id="free">0</b></div>
  </div>
</header>
<div class="zoom" role="group" aria-label="Ansicht">
  <button id="zin"  aria-label="Näher heranzoomen">+</button>
  <button id="zout" aria-label="Weiter herauszoomen">&#8722;</button>
  <button id="zfit" aria-label="Ganze Stadt zeigen">&#9633;</button>
  <button id="zhelp" aria-label="Hilfe und Gebäudeübersicht">?</button>
</div>

<div class="sheet" id="help" role="dialog" aria-modal="true" aria-labelledby="helpTitle" hidden>
  <div class="sheetInner">
    <header class="sheetTop">
      <h1 id="helpTitle">Iso-Stadt</h1>
      <button id="helpClose" aria-label="Hilfe schließen">&#10005;</button>
    </header>
    <div class="sheetBody" id="helpBody"></div>
  </div>
</div>
<div class="topActs">
  <button id="bSave" title="Spielstand als Datei herunterladen">Sichern</button>
  <button id="bLoad" title="Spielstand aus einer Datei einlesen">Laden</button>
</div>

<p class="tip" id="tip">Straßen vom Rathaus aus verlegen. Gebäude lang halten, um sie zu versetzen.</p>
<nav class="tray" id="tray" aria-label="Baumenü"></nav>

<script>
"use strict";

/* ============================================================
   1. SPIELDATEN
============================================================ */
const TYPES = {
  road: { key:'road', label:'Straße', cost:10, isRoad:true,
    stages:[{name:'Straße', yield:0, time:0, pop:0, h:0, roofH:0, upgrade:null}] },

  /* Die Stufen laufen durch die Epochen: Holzhütte, Fachwerk, Gründerzeit,
     Nachkriegsmoderne. Höhere Stufen bringen mehr, brauchen aber länger. */
  hut: { key:'hut', label:'Hütte', cost:50, needsRoad:true,
    stages:[
      {name:'Hütte',      yield:8,   time:8,   pop:2,  h:19, roofH:19, floors:1,
       style:'rustic', wall:'#A08765', roof:'#C0A469', trim:'#5A452F', upgrade:170},
      {name:'Fachwerkhaus', yield:30, time:14,  pop:6,  h:31, roofH:15, floors:2,
       style:'timber', wall:'#E0D6C0', roof:'#9C6248', trim:'#4E3B2D', upgrade:520},
      {name:'Stadthaus',  yield:95,  time:26,  pop:14, h:46, roofH:17, floors:3,
       style:'stone',  wall:'#E6DCC6', roof:'#7C6F80', trim:'#8E836E', upgrade:1600},
      {name:'Wohnblock',  yield:340, time:60,  pop:34, h:58, roofH:6,  floors:4,
       style:'modern', wall:'#C8C7C0', roof:'#5A5F62', trim:'#8B9095', upgrade:5200},
      {name:'Hochhaus',   yield:1150, time:110, pop:82,  h:68, roofH:6, floors:6,
       style:'glass',  wall:'#8E9AA2', roof:'#4A5660', trim:'#B3BDC3', upgrade:16000},
      {name:'Arkologie',  yield:4200, time:240, pop:210, h:80, roofH:6, floors:7,
       style:'arc',    wall:'#46586E', roof:'#2C3A4C', trim:'#7FD8D0', upgrade:null}
    ] },

  shop: { key:'shop', label:'Werkstatt', cost:320, needsRoad:true,
    stages:[
      {name:'Werkstatt',   yield:120,   time:30,  pop:0, staff:4,   h:23, roofH:11, floors:1,
       style:'timber', wall:'#C9B99C', roof:'#67757D', trim:'#463A2E', upgrade:820},
      {name:'Manufaktur',  yield:520,   time:70,  pop:0, staff:14,  h:34, roofH:13, floors:2,
       style:'stone',  wall:'#B5836B', roof:'#5E5A5E', trim:'#7A5644', upgrade:2400},
      {name:'Fabrik',      yield:1560,  time:180, pop:0, staff:40,  h:56, roofH:9,  floors:4,
       style:'brick',  wall:'#8E4536', roof:'#454E52', trim:'#C9B48C', upgrade:9000},
      {name:'Montagewerk', yield:4800,  time:300, pop:0, staff:95,  h:66, roofH:6,  floors:3,
       style:'plant',  wall:'#9AA39F', roof:'#4E5658', trim:'#C4713A', upgrade:30000},
      {name:'Fusionswerk', yield:15000, time:600, pop:0, staff:210, h:76, roofH:6,  floors:4,
       style:'fusion', wall:'#38485C', roof:'#22303F', trim:'#6FD9E6', upgrade:null}
    ] },

  tree1: { key:'tree1', label:'Kleiner Baum', cost:800, aura:0.60, tree:'small',
    trunkH:14, sway:0.052,
    stages:[{name:'Kleiner Baum', yield:0, time:0, pop:0, h:26, roofH:0, floors:0, upgrade:null}] },

  tree2: { key:'tree2', label:'Großer Baum', cost:2500, aura:1.00, tree:'big',
    trunkH:25, sway:0.030,
    stages:[{name:'Großer Baum', yield:0, time:0, pop:0, h:46, roofH:0, floors:0, upgrade:null}] },

  well: { key:'well', label:'Brunnen', cost:240, aura:0.30,
    wall:'#A8AFA9', roof:'#6B4E3C', beam:'#4E3B2D',
    stages:[{name:'Brunnen', yield:0, time:0, pop:0, h:11, roofH:12, floors:0, upgrade:null}] },

  hall: { key:'hall', label:'Rathaus', cost:0, fixed:true,
    stages:[{name:'Rathaus', yield:14, time:20, pop:5, h:42, roofH:22, floors:3,
       style:'stone', wall:'#DED3B8', roof:'#3F5A6B', trim:'#8A7F68', clock:true, upgrade:null}] }
};

const TW = 68, TH = 34, DEPTH = 9;
const P = 4;                    // Kantenlänge eines Bauabschnitts in Feldern
const SMIN = -2, SMAX = 3;      // Weltgrenzen in Abschnitten
const PLOT0 = 10000;            // Preis des ersten Zukaufs
const N4 = [[1,0],[-1,0],[0,1],[0,-1]];

/* Wind: einmal pro Bild berechnet, von allen Pflanzen geteilt.
   Der Halm- und Kronenausschlag entsteht danach durch eine Scherung —
   kein zusätzlicher Zeichenaufruf, kein zusätzlicher Speicher. */
let wind = 0, windT = 0;

const state = {
  coins:220, tiles:new Map(), net:new Set(), tool:'road',
  hover:null, floats:[], puffs:[], moving:null,   // angehobenes Gebäude
  plots: new Set(['0,0','1,0','0,1','1,1']),   // Startfläche: 8x8 Felder
  cells: [],                                   // alle freigeschalteten Felder
  bounds: null,
  pop: { total:0, used:0 },
  free: 0
};

const plotKey = (gx,gy) => Math.floor(gx/P) + ',' + Math.floor(gy/P);
const unlocked = (gx,gy) => state.plots.has(plotKey(gx,gy));
const plotPrice = () => Math.round(PLOT0 * Math.pow(1.5, state.plots.size - 4) / 500) * 500;

/* Angrenzende, noch nicht gekaufte Abschnitte */
function offers(){
  const out = [];
  for (const k of state.plots){
    const [sx,sy] = k.split(',').map(Number);
    for (const [dx,dy] of N4){
      const nx = sx+dx, ny = sy+dy, nk = nx+','+ny;
      if (nx<SMIN||nx>SMAX||ny<SMIN||ny>SMAX) continue;
      if (state.plots.has(nk) || out.some(o=>o.k===nk)) continue;
      out.push({ k:nk, sx:nx, sy:ny });
    }
  }
  return out;
}

/* Feldliste und Weltgrenzen neu bestimmen, wenn sich die Fläche ändert */
function rebuildWorld(){
  const cells = [];
  let x0=1e9, x1=-1e9, y0=1e9, y1=-1e9;
  for (const k of state.plots){
    const [sx,sy] = k.split(',').map(Number);
    for (let i=0;i<P;i++) for (let j=0;j<P;j++){
      const gx = sx*P+i, gy = sy*P+j;
      cells.push([gx,gy]);
      const w = iso(gx,gy);
      x0=Math.min(x0,w.x-TW/2); x1=Math.max(x1,w.x+TW/2);
      y0=Math.min(y0,w.y-TH/2); y1=Math.max(y1,w.y+TH/2+DEPTH);
    }
  }
  cells.sort((a,b)=>(a[0]+a[1])-(b[0]+b[1]));   // Malerreihenfolge
  state.cells = cells;
  state.bounds = { x0, x1, y0:y0-110, y1 };     // oben Luft für hohe Häuser
}

const key = (x,y) => x + ',' + y;
const at  = (x,y) => state.tiles.get(key(x,y));
const now = () => Date.now();
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---- Ambiente: Zustand für alles, was nur lebt und nichts kostet ---- */
let walkers = [], walkerNetSize = -1;
let birds = [], nextFlock = now() + 7000;
let shoot = null, nextShoot = now() + 9000 + Math.random()*14000;
let starA = null, starB = null;
let lastFrame = now();
let clouds = [];
for (let ci=0; ci<3; ci++){
  const blobs = [];
  const bn = 5+((Math.random()*3)|0);
  for (let k=0;k<bn;k++)
    blobs.push({ ox:(Math.random()-.5)*560, oy:(Math.random()-.5)*130,
                 r:110+Math.random()*150 });
  clouds.push({ fy:.15+Math.random()*.7,
                sp:(4.5+Math.random()*4)*(Math.random()<.5?-1:1),
                off:Math.random()*4000, blobs });
}

/* ---- Tag und Nacht ---- */
const DAY_CYCLE = 150000;          // ein voller Tag in Millisekunden
let dayOffset = 0.32;              // Spielstart am Vormittag
let dayF = 1, dayS = 1, nightF = 0;

/* ============================================================
   2. STRASSENNETZ
============================================================ */
function computeNetwork(){
  const net = new Set();
  const hall = [...state.tiles.values()].find(b => b.type === 'hall');
  if (!hall) return net;
  const q = [];
  const push = (x,y) => {
    const k = key(x,y), t = state.tiles.get(k);
    if (t && t.type === 'road' && !net.has(k)){ net.add(k); q.push(t); }
  };
  for (const [dx,dy] of N4) push(hall.x+dx, hall.y+dy);
  while (q.length){ const c = q.pop(); for (const [dx,dy] of N4) push(c.x+dx, c.y+dy); }
  return net;
}
function isConnected(b){
  if (b.type === 'hall') return true;
  if (!TYPES[b.type].needsRoad) return true;
  return N4.some(([dx,dy]) => state.net.has(key(b.x+dx, b.y+dy)));
}

/* ============================================================
   3. SPIELLOGIK
============================================================ */
function stageOf(b){ return TYPES[b.type].stages[b.level]; }
function boost(b){
  let f = 1;
  for (const [dx,dy] of N4){ const n = at(b.x+dx,b.y+dy); if (n && TYPES[n.type].aura) f += TYPES[n.type].aura; }
  return f;
}
function payout(b){
  let y = stageOf(b).yield;
  // Das Rathaus zieht Steuern: je mehr Einwohner die Stadt hat, desto mehr kommt herein.
  if (b.type === 'hall') y += Math.round(state.pop.total * 1.6);
  return Math.round(y * boost(b));
}
function isReady(b){ return stageOf(b).time > 0 && b.active && b.paused == null && now() >= b.done; }
const freePop = () => state.pop.total - state.pop.used;
function progress(b){
  const s = stageOf(b); if (!s.time) return 1;
  const rest = b.paused != null ? b.paused : b.done - now();
  return Math.min(1, Math.max(0, 1 - rest/(s.time*1000)));
}
function build(x,y,type){
  const t = TYPES[type];
  if (!unlocked(x,y)) return;
  if (at(x,y)) return flash('Das Feld ist bereits bebaut.');   // nie überbauen
  if (state.coins < t.cost) return flash('Zu wenig Münzen für ' + t.label + '.');
  const need = t.stages[0].staff || 0;
  if (need > freePop())
    return flash(t.label + ' braucht ' + need + ' freie Einwohner — ' + freePop() + ' verfügbar.');
  state.coins -= t.cost;
  state.tiles.set(key(x,y), { x, y, type, level:0, conn:false, paused:null,
    invested: t.cost, done: now() + t.stages[0].time*1000, born: now() });
  puff(x,y); refresh();
}
function collect(b){
  const amount = payout(b);
  state.coins += amount;
  b.done = now() + stageOf(b).time*1000;
  const p = iso(b.x,b.y), s = stageOf(b);
  state.floats.push({ x:p.x, y:p.y - s.h - s.roofH - 24, text:'+'+amount, t:now() });
  refresh();
}
function upgrade(b){
  const cost = stageOf(b).upgrade;
  if (cost === null) return flash(stageOf(b).name + ' ist voll ausgebaut.');
  if (state.coins < cost) return flash('Ausbau kostet ' + cost + ' Münzen.');
  const next = TYPES[b.type].stages[b.level+1];
  const extra = (next.staff||0) - (stageOf(b).staff||0);
  if (extra > freePop())
    return flash(next.name + ' braucht ' + extra + ' Einwohner mehr — ' + freePop() + ' frei.');
  state.coins -= cost; b.level++; b.invested = (b.invested||TYPES[b.type].cost) + cost;
  b.done = now() + stageOf(b).time*1000; b.paused = null; b.born = now();
  puff(b.x,b.y);
  const ns = stageOf(b);
  flash(ns.time
    ? ns.name + ': ' + payout(b) + ' Münzen alle ' + ns.time + ' s.'
    : ns.name + ' fertiggestellt.');
  refresh();
}
/* Versetzen lässt Stufe, Restzeit und Investition unangetastet — es wandert
   dasselbe Objekt auf ein anderes Feld. Straßennetz und Personal rechnet
   refresh() danach neu, samt Einfrieren oder Fortsetzen der Produktion. */
function moveTo(gx, gy){
  const src = state.moving;
  if (!src) return;
  const b = at(src.x, src.y);
  if (!b){ state.moving = null; return; }
  if (gx === src.x && gy === src.y){
    state.moving = null;
    return flash('Verschieben abgebrochen.');
  }
  if (!unlocked(gx, gy)) return flash('Dieses Feld gehört noch nicht zur Stadt.');
  if (at(gx, gy)) return flash('Zielfeld ist belegt.');

  state.tiles.delete(key(src.x, src.y));
  b.x = gx; b.y = gy;
  state.tiles.set(key(gx, gy), b);
  state.moving = null;
  puff(gx, gy);
  refresh();
  flash(stageOf(b).name + ' versetzt.');
}

function pickUp(b){
  if (TYPES[b.type].fixed) return flash('Das Rathaus bleibt, wo es ist.');
  state.moving = { x:b.x, y:b.y };
  flash(stageOf(b).name + ' angehoben — freies Zielfeld antippen.');
}

function demolish(b){
  if (TYPES[b.type].fixed) return flash('Das Rathaus bleibt stehen.');
  state.coins += Math.floor((b.invested || TYPES[b.type].cost)/2);
  state.tiles.delete(key(b.x,b.y)); puff(b.x,b.y); refresh();
}
function puff(x,y){
  if (reduceMotion) return;
  const p = iso(x,y);
  for (let i=0;i<8;i++) state.puffs.push({ x:p.x+(Math.random()-.5)*38, y:p.y+(Math.random()-.5)*15,
    r:3+Math.random()*5, t:now() });
}

/* ============================================================
   4. ISOMETRIE
============================================================ */
/* Kamera: cam.x/cam.y ist der Weltpunkt in der Bildschirmmitte, cam.z der Zoom. */
const cam = { x:0, y:80, z:1 };
const ZMIN = 0.35, ZMAX = 3.2;
function bx(){ return state.bounds ? (state.bounds.x1 - state.bounds.x0)/2 + 60 : 300; }

function iso(gx,gy){ return { x:(gx-gy)*TW/2, y:(gx+gy)*TH/2 }; }

function toWorld(sx,sy){
  return { x:(sx - W/2)/cam.z + cam.x, y:(sy - H/2)/cam.z + cam.y };
}
function toTile(sx,sy){
  const w = toWorld(sx,sy);
  return { x: Math.floor(w.y/TH + w.x/TW + 0.5), y: Math.floor(w.y/TH - w.x/TW + 0.5) };
}
function worldCenter(){
  const b = state.bounds;
  return b ? { x:(b.x0+b.x1)/2, y:(b.y0+b.y1)/2 } : { x:0, y:80 };
}
function clampCam(){
  const b = state.bounds; if (!b) return;
  const m = 80/cam.z;
  cam.x = Math.max(b.x0-m, Math.min(b.x1+m, cam.x));
  cam.y = Math.max(b.y0-m, Math.min(b.y1+m, cam.y));
}
/* Zoomen so, dass der Weltpunkt unter dem Zeiger stehen bleibt. */
function zoomAt(sx, sy, factor){
  const before = toWorld(sx,sy);
  cam.z = Math.max(ZMIN, Math.min(ZMAX, cam.z*factor));
  const after = toWorld(sx,sy);
  cam.x += before.x - after.x;
  cam.y += before.y - after.y;
  clampCam();
}
function fitZoom(){
  const b = state.bounds; if (!b) return 1;
  return Math.max(ZMIN, Math.min(2,
    Math.min((W-24)/(b.x1-b.x0), (H-210)/(b.y1-b.y0))));
}
function resetView(){ const c = worldCenter(); cam.z = fitZoom(); cam.x = c.x; cam.y = c.y; clampCam(); }

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W=0, H=0, DPR=1, sky=null;

function resize(){
  DPR = Math.min(devicePixelRatio || 1, 2);
  const ss = Math.min(3, DPR + 1);
  if (ss !== SS){ SS = ss; cache.clear(); }
  W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  sky = null;                                      // Himmel kommt jetzt aus paintSky()
  buildSky();
  if (!started) resetView(); else clampCam();
}
let started = false;
addEventListener('resize', resize);

/* Der Himmel wird einmal je Auflösung vorberechnet: zwei Sternebenen plus
   Mond. Im Bild genügen dann zwei Kopien mit pulsierender Deckkraft. */
function buildSky(){
  function layer(n){
    const c = document.createElement('canvas');
    c.width = Math.max(2,W*DPR); c.height = Math.max(2,H*DPR);
    const g = c.getContext('2d'); g.scale(DPR,DPR);
    g.fillStyle = '#DAE5E9';
    for (let i=0;i<n;i++){
      const x = Math.random()*W, y = Math.random()*H*.75,
            r = .35+Math.random()*Math.random()*1.15;
      g.globalAlpha = .16+Math.random()*.5;
      g.beginPath(); g.arc(x,y,r,0,7); g.fill();
      if (r>1.05){ g.fillRect(x-.5,y-r*3,1,r*6); g.fillRect(x-r*3,y-.5,r*6,1); }
    }
    return g;
  }
  /* Nur Sterne — Sonne und Mond laufen dynamisch über den Himmel */
  starA = layer(90).canvas;
  starB = layer(55).canvas;
}

/* Mischfarbe zwischen zwei Hex-Tönen */
function mixHex(a,b,t){
  const pa = parseInt(a.slice(1),16), pb = parseInt(b.slice(1),16);
  const ch = s => Math.round(((pa>>s)&255) + (((pb>>s)&255)-((pa>>s)&255))*t);
  return 'rgb('+ch(16)+','+ch(8)+','+ch(0)+')';
}

/* Himmelsverlauf je Tageszeit: nachts tiefblau, mittags helles Graublau */
function paintSky(){
  const gr = ctx.createRadialGradient(W/2,H*0.42,40, W/2,H*0.42, Math.max(W,H)*0.78);
  gr.addColorStop(0, mixHex('#15252F','#79ACC0',dayS));
  gr.addColorStop(1, mixHex('#0A141B','#CFE0D6',dayS));
  return gr;
}

/* Sonne und Mond wandern auf einer Bogenbahn über das Bild; die Stellung
   folgt direkt der Tageszeit, am Horizont blenden beide sanft ein. */
function drawCelestial(dayRaw){
  const arcPos = p => ({ x:-90+(W+180)*p,
    y:H*0.50 - Math.sin(Math.min(1,Math.max(0,p))*Math.PI)*H*0.36 });
  const vis = e => Math.max(0, Math.min(1, e*4));

  // Sonne: über dem Horizont von 6 bis 18 Uhr
  const sp = (dayRaw-0.25)/0.5;
  if (sp > 0 && sp < 1){
    const c = arcPos(sp), a = vis(Math.min(sp,1-sp)), hr = H*0.10;
    const halo = ctx.createRadialGradient(c.x,c.y,6, c.x,c.y,hr);
    halo.addColorStop(0,'rgba(255,226,160,'+(.5*a).toFixed(3)+')');
    halo.addColorStop(1,'rgba(255,226,160,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(c.x,c.y,hr,0,7); ctx.fill();
    ctx.globalAlpha = a;
    ctx.fillStyle = '#FFEFC4';
    ctx.beginPath(); ctx.arc(c.x,c.y,13,0,7); ctx.fill();
    ctx.fillStyle = '#FFF7DF';
    ctx.beginPath(); ctx.arc(c.x-3,c.y-3,8,0,7); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Mond: die halbe Schicht versetzt zur Sonne
  const mp = (((dayRaw+0.5)%1)-0.25)/0.5;
  if (mp > 0 && mp < 1 && nightF > 0.02){
    const c = arcPos(mp), a = vis(Math.min(mp,1-mp))*nightF, mr = 11;
    const halo = ctx.createRadialGradient(c.x,c.y,mr*.4, c.x,c.y,mr*5);
    halo.addColorStop(0,'rgba(222,232,236,'+(.20*a).toFixed(3)+')');
    halo.addColorStop(1,'rgba(222,232,236,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(c.x,c.y,mr*5,0,7); ctx.fill();
    ctx.globalAlpha = a;
    ctx.fillStyle = '#D6E0E4';
    ctx.beginPath(); ctx.arc(c.x,c.y,mr,0,7); ctx.fill();
    ctx.fillStyle = 'rgba(11,19,27,.78)';
    ctx.beginPath(); ctx.arc(c.x-mr*.45,c.y-mr*.2,mr*.95,0,7); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

/* ============================================================
   5. GEOMETRIE-HELFER
============================================================ */
function diamond(g,cx,cy,w,h){
  g.beginPath(); g.moveTo(cx,cy-h/2); g.lineTo(cx+w/2,cy);
  g.lineTo(cx,cy+h/2); g.lineTo(cx-w/2,cy); g.closePath();
}
function poly(g, pts){
  g.beginPath(); g.moveTo(pts[0][0],pts[0][1]);
  for (let i=1;i<pts.length;i++) g.lineTo(pts[i][0],pts[i][1]);
  g.closePath();
}
function shade(hex,amt){
  const n = parseInt(hex.slice(1),16);
  return 'rgb(' + [n>>16,(n>>8)&255,n&255]
    .map(v => Math.max(0,Math.min(255,Math.round(v+amt)))).join(',') + ')';
}
const mid = (a,b,t) => [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t];

/* ============================================================
   6. GEBÄUDE ZEICHNEN
   Alles sind Canvas-Pfade, also echte Vektorgeometrie.
   Jede Kombination aus Typ/Stufe/Zustand wird EINMAL in ein
   Offscreen-Canvas gerendert und danach nur noch kopiert.
============================================================ */
const cache = new Map();
/* Die Zeichenroutine meldet, wo der Schornstein endet — so muss die
   Rauchquelle nicht nachgerechnet werden und kann nicht auseinanderlaufen. */
let lastChimney = null;
let SS = 2;   // Überabtastung der Sprites, wird in resize() an das Gerät angepasst

/* Der Rahmen wächst mit dem Gebäude — ein Turm braucht mehr Luft als eine Hütte. */
function spriteBox(type, level){
  if (type === 'well') return { w:120, h:150, ax:60, ay:112 };
  const st = TYPES[type].stages[level];
  const ay = Math.ceil(st.h + st.roofH + 62);
  return { w:150, h:ay + 44, ax:75, ay };
}

function sprite(type, level, mode){
  const k = type+'|'+level+'|'+mode;
  if (cache.has(k)) return cache.get(k);
  if (cache.size > 64) cache.clear();
  const box = spriteBox(type, level);
  const off = document.createElement('canvas');
  off.width = box.w*SS; off.height = box.h*SS;
  const g = off.getContext('2d');
  g.scale(SS,SS);
  g.translate(box.ax, box.ay);
  paintAny(g, type, level, mode);
  const s = { cv:off, w:box.w, h:box.h, ax:box.ax, ay:box.ay, smoke:lastChimney };
  cache.set(k, s);
  return s;
}

function paintHouse(g, type, level, mode){
  const t = TYPES[type], s = t.stages[level];
  const st = s.style || 'timber';
  const wallC = s.wall || t.wall, roofC = s.roof || t.roof, trimC = s.trim || t.beam;
  const bw = TW*0.55, bh = TH*0.55;
  const h = s.h, rH = s.roofH;
  const dim = mode === 'cut' ? -40 : 0;
  const lit = mode === 'lit';
  const glass = lit ? '#FFCE69' : (mode === 'cut' ? '#3A464C' : '#7C8E96');

  g.fillStyle = 'rgba(0,0,0,.3)';
  diamond(g, 5, 4, bw*1.25, bh*1.25); g.fill();

  const L=[-bw/2,0], B=[0,bh/2], R=[bw/2,0], T=[0,-bh/2];
  const up = p => [p[0], p[1]-h];
  // Flächenkoordinaten: a läuft entlang der Wand, v von 0 (Boden) bis 1 (Traufe)
  const faceL = (a,v) => [L[0]+(B[0]-L[0])*a, L[1]+(B[1]-L[1])*a - h*v];
  const faceR = (a,v) => [B[0]+(R[0]-B[0])*a, B[1]+(R[1]-B[1])*a - h*v];
  const band = (face,a0,v0,a1,v1) => { poly(g,[face(a0,v0),face(a1,v0),face(a1,v1),face(a0,v1)]); g.fill(); };

  /* ---- Arkologie: der Turm verjüngt sich nach oben, also eigene Flächen ---- */
  if (st === 'arc'){
    const tf = 0.62;                       // Maßstab der Deckfläche
    const kAt = v => 1 - v + v*tf;
    const mk = (p0,p1) => (a,v) => {
      const k = kAt(v);
      return [(p0[0]+(p1[0]-p0[0])*a)*k, (p0[1]+(p1[1]-p0[1])*a)*k - h*v];
    };
    const fL = mk(L,B), fR = mk(B,R);
    const bd = (f,a0,v0,a1,v1) => { poly(g,[f(a0,v0),f(a1,v0),f(a1,v1),f(a0,v1)]); g.fill(); };

    g.fillStyle = shade(wallC,-4+dim);  poly(g,[fL(0,0),fL(1,0),fL(1,1),fL(0,1)]); g.fill();
    g.fillStyle = shade(wallC,-44+dim); poly(g,[fR(0,0),fR(1,0),fR(1,1),fR(0,1)]); g.fill();
    g.fillStyle = shade(wallC,16+dim);  diamond(g, 0, -h, bw*tf, bh*tf); g.fill();

    // Fensterbänder, jede dritte Ebene begrünt
    for (let f=1; f<=s.floors; f++){
      const v = f/(s.floors+1);
      for (const [f2,d] of [[fL,-4],[fR,-34]]){
        g.fillStyle = lit ? 'rgba(255,206,105,.92)' : shade(glass, d/3+dim);
        bd(f2, 0.07, v-0.020, 0.93, v+0.020);
        if (f % 3 === 0){
          g.fillStyle = shade('#5F8F62', d+dim);
          bd(f2, 0.04, v+0.022, 0.96, v+0.040);
        }
      }
    }
    // leuchtende Vorderkante
    g.strokeStyle = lit ? 'rgba(242,176,53,.8)' : shade(trimC,-20+dim);
    g.lineWidth = 1.8;
    g.beginPath(); g.moveTo(fL(1,0)[0],fL(1,0)[1]); g.lineTo(fL(1,1)[0],fL(1,1)[1]); g.stroke();

    // Schweberring
    const rv = 0.70, rk = kAt(rv);
    g.strokeStyle = lit ? 'rgba(127,216,208,.8)' : 'rgba(127,216,208,.32)';
    g.lineWidth = 2.4;
    g.beginPath(); g.ellipse(0, -h*rv, bw*rk*0.88, bh*rk*0.88, 0, 0, Math.PI*2); g.stroke();

    // Krone mit schwebender Kugel
    g.fillStyle = shade(roofC,14+dim); diamond(g, 0, -h-5, bw*tf*0.74, bh*tf*0.74); g.fill();
    g.strokeStyle = shade(trimC,-10+dim); g.lineWidth = 2.2;
    g.beginPath(); g.moveTo(0,-h-5); g.lineTo(0,-h-34); g.stroke();
    // zwei Höhenringe am Schaft
    g.strokeStyle = lit ? 'rgba(242,176,53,.55)' : 'rgba(127,216,208,.42)';
    g.lineWidth = 1.2;
    for (const yy of [-h-16, -h-26]){
      g.beginPath(); g.ellipse(0, yy, 6.5, 2.4, 0, 0, Math.PI*2); g.stroke();
    }
    g.fillStyle = lit ? '#F2B035' : '#7FD8D0';
    g.beginPath(); g.arc(0,-h-42,4.4,0,7); g.fill();
    g.strokeStyle = lit ? 'rgba(242,176,53,.5)' : 'rgba(127,216,208,.38)';
    g.lineWidth = 1.3;
    g.beginPath(); g.ellipse(0,-h-42,11,4,0,0,Math.PI*2); g.stroke();
    return;
  }

  /* ---- Fusionswerk: Reaktorkuppel mit Feldring, alles eigene Geometrie ---- */
  if (st === 'fusion'){
    const fL = (a,v) => [L[0]+(B[0]-L[0])*a, L[1]+(B[1]-L[1])*a - h*v];
    const fR = (a,v) => [B[0]+(R[0]-B[0])*a, B[1]+(R[1]-B[1])*a - h*v];
    const bd = (f,a0,v0,a1,v1) => { poly(g,[f(a0,v0),f(a1,v0),f(a1,v1),f(a0,v1)]); g.fill(); };
    const faces2 = [[fL,-6],[fR,-42]];
    const glow = lit ? 'rgba(242,176,53,' : 'rgba(111,217,230,';

    // Betonplatte als Standfläche
    g.fillStyle = shade('#2B3742', dim); diamond(g, 0, 1, bw*1.26, bh*1.26); g.fill();
    g.fillStyle = shade('#222D37', dim); diamond(g, 0, 3.4, bw*1.26, bh*1.26); g.fill();

    // Zylindrischer Körper
    for (const [f,d] of faces2){
      g.fillStyle = shade(wallC, d+dim); bd(f, 0, 0, 1, 1);
      // waagerechte Panelfugen
      g.fillStyle = 'rgba(0,0,0,.22)';
      for (let i=1;i<s.floors*2;i++) bd(f, 0, i/(s.floors*2)-0.005, 1, i/(s.floors*2)+0.005);
      // senkrechte Streben
      g.fillStyle = shade(wallC, d+14+dim);
      for (const a of [0.02,0.5,0.98]) bd(f, a-0.022, 0, a+0.022, 1);
      // leuchtende Bänder
      for (let i=1;i<=s.floors;i++){
        const v = i/(s.floors+1);
        g.fillStyle = glow + (d < -20 ? '.42)' : '.8)');
        bd(f, 0.08, v-0.014, 0.92, v+0.014);
      }
    }

    // Kuppel über dem Reaktor
    const rx = bw*0.46, domeH = 27;
    g.fillStyle = shade(roofC, 10+dim);
    g.beginPath();
    g.moveTo(-rx, -h);
    g.bezierCurveTo(-rx, -h-domeH*1.35, rx, -h-domeH*1.35, rx, -h);
    g.closePath(); g.fill();
    g.fillStyle = shade(roofC, -24+dim);
    g.beginPath(); g.ellipse(0, -h, rx, bh*0.30, 0, 0, Math.PI); g.fill();
    // Meridianrippen
    g.strokeStyle = 'rgba(0,0,0,.26)'; g.lineWidth = 1;
    for (const t of [-0.55,0,0.55]){
      g.beginPath(); g.moveTo(rx*t, -h);
      g.bezierCurveTo(rx*t*1.15, -h-domeH*0.95, rx*t*0.35, -h-domeH*1.16, 0, -h-domeH*1.02);
      g.stroke();
    }
    // Kern
    g.fillStyle = lit ? '#F2B035' : '#6FD9E6';
    g.beginPath(); g.ellipse(0, -h-domeH*0.98, 5.2, 3.4, 0, 0, Math.PI*2); g.fill();
    g.strokeStyle = glow + '.45)'; g.lineWidth = 1.4;
    g.beginPath(); g.ellipse(0, -h-domeH*0.98, 11, 4.6, 0, 0, Math.PI*2); g.stroke();

    // Feldring um den Bau
    const rv = 0.62;
    g.strokeStyle = glow + (lit ? '.85)' : '.4)'); g.lineWidth = 3;
    g.beginPath(); g.ellipse(0, -h*rv, bw*0.72, bh*0.72, 0, 0, Math.PI*2); g.stroke();
    g.strokeStyle = glow + '.25)'; g.lineWidth = 5.5;
    g.beginPath(); g.ellipse(0, -h*rv, bw*0.72, bh*0.72, 0, 0, Math.PI*2); g.stroke();

    // Zwei Kühltürme
    for (const [cxx, cs] of [[-bw*0.60, 0.72], [bw*0.58, 0.60]]){
      const cr = 6*cs, cH = 34*cs, cy = bh*0.16;
      g.fillStyle = shade('#8D98A2', -34+dim);
      g.beginPath(); g.ellipse(cxx, cy, cr, cr*0.5, 0, 0, Math.PI);
      g.lineTo(cxx-cr*0.82, cy-cH);
      g.ellipse(cxx, cy-cH, cr*0.82, cr*0.41, 0, Math.PI, 0, true);
      g.closePath(); g.fill();
      g.fillStyle = shade('#A6B0B8', 4+dim);
      g.beginPath(); g.ellipse(cxx, cy-cH, cr*0.82, cr*0.41, 0, 0, Math.PI*2); g.fill();
      g.fillStyle = shade('#2E3A44', dim);
      g.beginPath(); g.ellipse(cxx, cy-cH, cr*0.58, cr*0.29, 0, 0, Math.PI*2); g.fill();
      g.strokeStyle = glow + '.35)'; g.lineWidth = 1.2;
      g.beginPath(); g.ellipse(cxx, cy-cH*0.55, cr*0.95, cr*0.48, 0, 0, Math.PI*2); g.stroke();
    }
    return;
  }

  // ---- Wandflächen: links im Licht, rechts im Schatten ----
  g.fillStyle = shade(wallC, -4+dim);  poly(g,[L,B,up(B),up(L)]); g.fill();
  g.fillStyle = shade(wallC, -42+dim); poly(g,[B,R,up(R),up(B)]); g.fill();

  const faces = [[faceL,-4],[faceR,-32]];
  const sock = (st === 'modern' || st === 'glass') ? 0
              : (st === 'brick' || st === 'plant') ? 0.10 : 0.15;

  // ---- Sockel ----
  if (sock){
    for (const [face,d] of faces){
      g.fillStyle = shade(st==='rustic' ? '#6E6A5C' : '#7A7367', d/2+dim);
      band(face,0,0,1,sock);
    }
    g.fillStyle = 'rgba(0,0,0,.16)';
    for (let i=1;i<5;i++) band(faceL,i/5-0.006,0,i/5+0.006,sock);
  }

  /* ==================== FASSADEN NACH EPOCHE ==================== */
  if (st === 'rustic'){
    /* Die Hütte bekommt das volle Handwerk: Bohlen mit Rhythmus, schräge
       Streben, Steinplinth, Tür mit Beschlägen, Fenster mit Läden und
       Blumenkasten, dazu Holzstoß, Fass und Laterne — alles landet im
       Sprite und kostet zur Laufzeit nichts. */
    for (const [face,d] of faces){
      g.fillStyle = 'rgba(60,44,28,.22)';
      for (let i=1;i<8;i++) band(face,i/8-0.008,sock,i/8+0.008,1);
      g.fillStyle = 'rgba(255,240,210,.045)';        // jedes zweite Brett heller
      for (let i=0;i<4;i++) band(face,(i*2)/8+0.012,sock,(i*2+1)/8-0.012,0.92);
      g.fillStyle = shade(trimC, d+dim);
      band(face,0,0.95,1,1);
      band(face,0.0,sock,0.05,1); band(face,0.95,sock,1,1);
      // schräge Strebe von der Schwelle hoch zur Traufe
      const s0 = face(0.06,sock+0.05), s1 = face(0.38,0.96);
      const sdx = s1[0]-s0[0], sdy = s1[1]-s0[1], sl = Math.hypot(sdx,sdy);
      const snx = -sdy/sl*1.2, sny = sdx/sl*1.2;
      g.fillStyle = shade(trimC, d-8+dim);
      poly(g,[[s0[0]+snx,s0[1]+sny],[s1[0]+snx,s1[1]+sny],
              [s1[0]-snx,s1[1]-sny],[s0[0]-snx,s0[1]-sny]]); g.fill();
      // Steinplinth: einzelne Quader statt glatter Sockelfläche
      for (let i=0;i<6;i++){
        const su = 0.055+0.155*i;
        g.fillStyle = shade(i%2 ? '#87826F' : '#726C59', d/2+(i%3)*5+dim);
        band(face,su,0,su+0.125,sock*0.92);
      }
    }

    /* ---- Tür mit Beschlägen, Klinke und Steinschwelle ---- */
    g.fillStyle = shade('#6B4A33',-4+dim); band(faceL,0.26,sock,0.46,sock+0.48);
    g.fillStyle = 'rgba(35,24,14,.45)';
    for (const du of [0.312,0.362,0.412]) band(faceL,du-0.004,sock+0.03,du+0.004,sock+0.45);
    for (const hv of [0.10,0.36]){
      g.fillStyle = shade('#3E2E1C',8+dim);
      band(faceL,0.276,sock+hv,0.351,sock+hv+0.045);
    }
    g.fillStyle = '#D8B25A';
    const kh = faceL(0.432,sock+0.24);
    g.beginPath(); g.arc(kh[0],kh[1],0.9,0,7); g.fill();
    g.fillStyle = shade('#8F8878',2+dim);            // Steinschwelle
    band(faceL,0.243,sock-0.05,0.478,sock);
    g.fillStyle = shade(trimC,-8+dim);               // Türsturz
    band(faceL,0.24,sock+0.46,0.48,sock+0.52);

    /* ---- Fenster mit Läden und Blumenkasten ---- */
    const wa0=0.64, wa1=0.80, wv0=0.52, wv1=0.74;
    g.fillStyle = shade('#5E7060',-6+dim);
    band(faceL,wa0-0.075,wv0-0.01,wa0-0.008,wv1+0.01);
    band(faceL,wa1+0.008,wv0-0.01,wa1+0.075,wv1+0.01);
    g.fillStyle = shade('#5E7060',7+dim);            // obere Ladenschiene
    band(faceL,wa0-0.075,wv0-0.01,wa1+0.075,wv0+0.045);
    g.fillStyle = lit ? '#FFCE69' : shade(glass,-14+dim);
    band(faceL,wa0,wv0,wa1,wv1);
    g.fillStyle = shade(trimC,-2+dim);
    band(faceL,(wa0+wa1)/2-0.012,wv0,(wa0+wa1)/2+0.012,wv1);
    band(faceL,wa0,wv0+(wv1-wv0)*0.52,wa1,wv0+(wv1-wv0)*0.60);
    g.fillStyle = shade('#9C5A3C',-2+dim);           // Blumenkasten
    band(faceL,wa0-0.04,wv1+0.02,wa1+0.04,wv1+0.12);
    g.fillStyle = shade('#5F8F62',4+dim);
    band(faceL,wa0-0.025,wv1+0.035,wa1+0.025,wv1+0.065);
    for (const [fu,fcc] of [[wa0+0.01,'#C46A5C'],[(wa0+wa1)/2+0.01,'#D8A94E'],[wa1-0.005,'#C46A5C']]){
      const fp = faceL(fu,wv1+0.085);
      g.fillStyle = shade(fcc,10+dim);
      g.beginPath(); g.arc(fp[0],fp[1],0.95,0,7); g.fill();
    }
    g.fillStyle = lit ? 'rgba(255,206,105,.75)' : shade(glass,-34+dim);
    band(faceR,0.55,0.52,0.70,0.72);
    g.fillStyle = shade('#5E7060',-28+dim);          // enge Läden rechts
    band(faceR,0.495,0.51,0.545,0.73);
    band(faceR,0.705,0.51,0.755,0.73);

    /* ---- Laterne neben der Tür (nur bei Beleuchtung) ---- */
    if (lit){
      const lp = faceL(0.515,sock+0.28);
      g.strokeStyle = shade('#20282C',dim); g.lineWidth = 1;
      g.beginPath(); g.moveTo(lp[0],lp[1]+6); g.lineTo(lp[0],lp[1]+1.5); g.stroke();
      const lglow = g.createRadialGradient(lp[0],lp[1]+3.4,.4,lp[0],lp[1]+3.4,7);
      lglow.addColorStop(0,'rgba(255,214,130,.8)');
      lglow.addColorStop(1,'rgba(255,214,130,0)');
      g.fillStyle = lglow;
      g.beginPath(); g.arc(lp[0],lp[1]+3.4,7,0,7); g.fill();
      g.fillStyle = '#FFD98F';
      diamond(g,lp[0],lp[1]+3.4,3,4); g.fill();
    }

    /* ---- Holzstoß an der Westwand, Fass an der Ostseite ---- */
    const fx2 = -bw*0.60, fy2 = bh*0.10;
    g.fillStyle = 'rgba(0,0,0,.25)';
    g.beginPath(); g.ellipse(fx2, fy2+2.2, 10.5, 3.2, 0, 0, 7); g.fill();
    const logRow = (cy3,cnt) => {
      for (let li=0; li<cnt; li++){
        const lx2 = fx2+(li-(cnt-1)/2)*5.1;
        g.fillStyle = shade('#8A6A4E',dim);
        g.beginPath(); g.arc(lx2,cy3,2.4,0,7); g.fill();
        g.fillStyle = shade('#B08A62',6+dim);
        g.beginPath(); g.arc(lx2,cy3,1.5,0,7); g.fill();
        g.fillStyle = shade('#6E4E34',-4+dim);
        g.beginPath(); g.arc(lx2-0.35,cy3-0.3,0.5,0,7); g.fill();
      }
    };
    logRow(fy2,4); logRow(fy2-3.9,3); logRow(fy2-7.4,2);
    const bx4 = bw*0.58, by4 = bh*0.06;
    g.fillStyle = 'rgba(0,0,0,.25)';
    g.beginPath(); g.ellipse(bx4,by4+5.8,5.6,1.9,0,0,7); g.fill();
    g.fillStyle = shade('#7A5638',-8+dim);
    poly(g,[[bx4-4.4,by4-6],[bx4+4.4,by4-6],[bx4+3.6,by4+5.4],[bx4-3.6,by4+5.4]]); g.fill();
    g.fillStyle = shade('#7A5638',10+dim);
    poly(g,[[bx4-4.4,by4-6],[bx4-1.4,by4-6],[bx4-1.1,by4+5.4],[bx4-3.6,by4+5.4]]); g.fill();
    g.fillStyle = shade('#4E3B2D',6+dim);
    g.fillRect(bx4-4.2,by4-3.2,8.4,1.3);
    g.fillRect(bx4-3.9,by4+2.7,7.8,1.3);
    g.fillStyle = shade('#8F6A46',16+dim);
    g.beginPath(); g.ellipse(bx4,by4-6,4.4,1.7,0,0,7); g.fill();
  }

  if (st === 'timber'){
    const beam = (face,a0,v0,a1,v1,w) => {
      const q = w || 0.028;
      poly(g,[face(a0-q,v0),face(a0+q,v0),face(a1+q,v1),face(a1-q,v1)]); g.fill();
    };
    for (const [face,d] of faces){
      g.fillStyle = shade(trimC, d+dim);
      band(face,0,sock,1,sock+0.05);
      band(face,0,0.95,1,1);
      for (let f=1; f<s.floors; f++){
        const v = sock + (1-sock)*f/s.floors;
        band(face,0,v-0.025,1,v+0.025);
      }
      for (const a of [0.04,0.5,0.96]) beam(face,a,sock,a,1);
      if (s.floors >= 2){
        beam(face,0.06,sock+0.06,0.30,sock+(1-sock)/s.floors-0.03,0.020);
        beam(face,0.94,sock+0.06,0.70,sock+(1-sock)/s.floors-0.03,0.020);
      }
    }
  }

  if (st === 'stone'){
    // Putzfassade mit Eckquadern, Gurtgesims und Traufgesims
    for (const [face,d] of faces){
      g.fillStyle = shade(trimC, d+dim);
      for (let i=0;i<7;i++){
        const v0 = sock+(1-sock)*i/7, v1 = sock+(1-sock)*(i+0.5)/7;
        const q = i%2 ? 0.055 : 0.085;
        band(face,0.002,v0,q,v1); band(face,1-q,v0,0.998,v1);
      }
      for (let f=1; f<s.floors; f++){
        const v = sock + (1-sock)*f/s.floors;
        g.fillStyle = shade(trimC, d+8+dim);
        band(face,0,v-0.014,1,v+0.014);
      }
      g.fillStyle = shade(trimC, d+14+dim);
      band(face,-0.02,0.94,1.02,1.0);
    }
  }

  if (st === 'modern'){
    // Sichtbeton mit Fensterbändern, Balkonen und Schaufensterfront
    for (const [face,d] of faces){
      g.fillStyle = shade(trimC, d-14+dim);
      for (let f=1; f<s.floors; f++) band(face,0,sock+(1-sock)*f/s.floors-0.008,1,sock+(1-sock)*f/s.floors+0.008);
    }
    g.fillStyle = lit ? 'rgba(255,206,105,.85)' : shade(glass,-16+dim);
    band(faceL,0.08,0.02,0.92,0.20);
    g.fillStyle = lit ? 'rgba(255,206,105,.55)' : shade(glass,-40+dim);
    band(faceR,0.08,0.02,0.92,0.20);
  }

  if (st === 'brick'){
    /* Backstein-Fabrik: Lisenen gliedern die Wand in Achsen, dazwischen hohe
       Sprossenfenster mit Segmentbogen. Oben ein Zahnschnitt-Gesims. */
    const bays = 4;
    for (const [face,d] of faces){
      // Ziegelschichten
      g.fillStyle = 'rgba(0,0,0,.10)';
      for (let i=1;i<16;i++) band(face,0,sock+(1-sock)*i/16-0.004,1,sock+(1-sock)*i/16+0.004);
      // Lisenen zwischen den Achsen
      g.fillStyle = shade(wallC, d+16+dim);
      for (let i=0;i<=bays;i++){
        const a = 0.03 + 0.94*i/bays;
        band(face, a-0.026, sock, a+0.026, 0.99);
      }
      // Fenster in den Achsen
      for (let i=0;i<bays;i++){
        const a0 = 0.03+0.94*i/bays+0.030, a1 = 0.03+0.94*(i+1)/bays-0.030;
        for (let f=0; f<s.floors; f++){
          const v0 = sock+(1-sock)*(f+0.16)/s.floors, v1 = sock+(1-sock)*(f+0.86)/s.floors;
          g.fillStyle = shade(trimC, d-24+dim);
          band(face, a0-0.012, v0-0.012, a1+0.012, v1+0.012);
          g.fillStyle = lit ? '#FFCE69' : shade(glass, d/3+dim);
          band(face, a0, v0, a1, v1);
          g.fillStyle = 'rgba(30,26,22,.5)';   // Sprossen
          band(face, (a0+a1)/2-0.006, v0, (a0+a1)/2+0.006, v1);
          for (let r=1;r<3;r++) band(face, a0, v0+(v1-v0)*r/3-0.005, a1, v0+(v1-v0)*r/3+0.005);
          g.fillStyle = shade(trimC, d+dim);   // heller Fenstersturz
          band(face, a0-0.016, v1+0.012, a1+0.016, v1+0.028);
        }
      }
      // Zahnschnitt und Traufgesims
      g.fillStyle = shade(wallC, d+24+dim);
      for (let i=0;i<11;i++) band(face, 0.03+0.94*i/11, 0.90, 0.03+0.94*i/11+0.042, 0.935);
      g.fillStyle = shade(trimC, d+dim);
      band(face,-0.02,0.945,1.02,0.995);
    }
  }

  if (st === 'plant'){
    /* Montagewerk: Trapezblech, Rolltor, hochliegendes Fensterband. */
    for (const [face,d] of faces){
      g.fillStyle = 'rgba(0,0,0,.13)';                  // senkrechte Sicken
      for (let i=1;i<20;i++) band(face, i/20-0.005, sock, i/20+0.005, 0.99);
      for (let i=0;i<14;i++){                           // Warnstreifen am Sockel
        g.fillStyle = i%2 ? shade(trimC, d+dim) : shade('#2E3438', d+dim);
        band(face, i/14, 0, (i+1)/14, sock);
      }
      g.fillStyle = shade(trimC, d-22+dim);             // Fensterband oben
      band(face, 0.05, 0.66, 0.95, 0.86);
      for (let i=0;i<7;i++){
        g.fillStyle = lit ? '#FFCE69' : shade(glass, d/3+dim);
        band(face, 0.065+0.87*i/7+0.006, 0.675, 0.065+0.87*(i+1)/7-0.006, 0.845);
      }
      g.fillStyle = shade(wallC, d+16+dim);             // Traufblech
      band(face, -0.02, 0.94, 1.02, 1.0);
    }
    // Rolltor mit orangefarbenem Rahmen
    g.fillStyle = shade(trimC,-4+dim); band(faceL, 0.14, sock, 0.60, sock+0.46);
    for (let i=0;i<8;i++){
      g.fillStyle = i%2 ? shade('#8C9692',-6+dim) : shade('#79837F',-6+dim);
      band(faceL, 0.165, sock+0.02+0.42*i/8, 0.575, sock+0.02+0.42*(i+1)/8-0.004);
    }
    // Nebentür und Lampe
    g.fillStyle = shade('#2E3438',-6+dim); band(faceL, 0.70, sock, 0.84, sock+0.30);
    g.fillStyle = lit ? 'rgba(255,206,105,.95)' : shade(glass,-20+dim);
    band(faceL, 0.665, sock+0.33, 0.70, sock+0.37);
  }

  if (st === 'glass'){
    // Vorhangfassade — einzelne Büros beleuchtet, das wirkt lebendiger als eine Leuchtwand
    const cols = 6;
    for (const [face,d] of faces){
      g.fillStyle = shade(trimC, d-30+dim);
      band(face,0,0,1,1);
      for (let f=0; f<s.floors; f++){
        const v0 = 0.03 + 0.94*f/s.floors, v1 = 0.03 + 0.94*(f+1)/s.floors;
        for (let i=0;i<cols;i++){
          const on = lit && ((f*5 + i*3 + (d < -20 ? 2 : 0)) % 7) !== 0;
          g.fillStyle = on ? '#FFCE69' : shade(glass, d/3 + dim);
          band(face, 0.06+0.88*i/cols+0.007, v0+0.006, 0.06+0.88*(i+1)/cols-0.007, v1-0.006);
        }
      }
      g.fillStyle = shade(wallC, d+8+dim);
      band(face,0,0,0.06,1); band(face,0.94,0,1,1);
    }
    // Eingangshalle mit Vordach
    g.fillStyle = shade(trimC,-10+dim); band(faceL,0.18,0,0.54,0.11);
    g.fillStyle = lit ? 'rgba(255,222,152,.95)' : shade(glass,-4+dim);
    band(faceL,0.21,0.008,0.51,0.095);
    const k0 = faceL(0.14,0.115), k1 = faceL(0.58,0.115);
    g.fillStyle = shade(wallC,-20+dim);
    poly(g,[k0,k1,[k1[0]-7,k1[1]+3.5],[k0[0]-7,k0[1]+3.5]]); g.fill();
  }

  /* ==================== FENSTER ==================== */
  if (st === 'timber' || st === 'stone'){
    const win = (face,a,v,wA,wV,d) => {
      g.fillStyle = shade(trimC, d+dim);
      band(face,a-wA-.014,v-wV-.022,a+wA+.014,v+wV+.022);
      g.fillStyle = lit ? glass : shade(glass, d/2+dim);
      band(face,a-wA,v-wV,a+wA,v+wV);
      g.fillStyle = 'rgba(30,26,22,.55)';
      band(face,a-.006,v-wV,a+.006,v+wV); band(face,a-wA,v-.008,a+wA,v+.008);
      if (st === 'timber'){
        g.fillStyle = shade('#5E7060', d+dim);
        band(face,a-wA-.055,v-wV,a-wA-.014,v+wV);
        band(face,a+wA+.014,v-wV,a+wA+.055,v+wV);
      } else {
        g.fillStyle = shade(trimC, d+16+dim);   // Fensterbank
        band(face,a-wA-.02,v-wV-.04,a+wA+.02,v-wV-.022);
      }
    };
    for (let f=0; f<s.floors; f++){
      const v = sock + (1-sock)*(f+0.55)/s.floors;
      const wV = Math.min(0.13, (1-sock)/s.floors*0.34);
      if (f === 0){
        g.fillStyle = shade(trimC,-4+dim); band(faceL,0.16,sock,0.40,v+wV+0.06);
        g.fillStyle = shade('#6B4A33',-6+dim); band(faceL,0.19,sock,0.37,v+wV+0.03);
        g.fillStyle = 'rgba(255,220,150,.8)'; band(faceL,0.345,v-0.02,0.358,v-0.005);
        win(faceL,0.72,v,0.09,wV,-4);
      } else { win(faceL,0.28,v,0.09,wV,-4); win(faceL,0.72,v,0.09,wV,-4); }
      win(faceR,0.35,v,0.085,wV,-30); win(faceR,0.72,v,0.085,wV,-30);
    }
  }

  if (st === 'modern'){
    for (let f=1; f<s.floors; f++){
      const v = sock + (1-sock)*(f+0.5)/s.floors, wV = (1-sock)/s.floors*0.26;
      for (const [face,d] of faces){
        g.fillStyle = shade(trimC, d-6+dim);
        band(face,0.08,v-wV-0.02,0.92,v+wV+0.02);
        g.fillStyle = lit ? '#FFCE69' : shade(glass, d/3+dim);
        band(face,0.10,v-wV,0.90,v+wV);
        g.fillStyle = 'rgba(40,46,50,.5)';
        for (const a of [0.31,0.52,0.73]) band(face,a-.007,v-wV,a+.007,v+wV);
      }
      // auskragender Balkon an der Sonnenseite
      const p0 = faceL(0.14, v-wV-0.03), p1 = faceL(0.62, v-wV-0.03);
      const ox = -8, oy = 4;
      const q0 = [p0[0]+ox,p0[1]+oy], q1 = [p1[0]+ox,p1[1]+oy];
      g.fillStyle = shade(wallC,-16+dim); poly(g,[p0,p1,q1,q0]); g.fill();
      g.fillStyle = shade(wallC,-40+dim);
      poly(g,[q0,q1,[q1[0],q1[1]+3],[q0[0],q0[1]+3]]); g.fill();
      g.strokeStyle = 'rgba(150,170,180,.55)'; g.lineWidth = 1;
      const rail = 8;
      g.beginPath(); g.moveTo(q0[0],q0[1]-rail); g.lineTo(q1[0],q1[1]-rail); g.stroke();
      for (let i=0;i<=6;i++){ const m = mid(q0,q1,i/6);
        g.beginPath(); g.moveTo(m[0],m[1]); g.lineTo(m[0],m[1]-rail); g.stroke(); }
    }
  }

  /* ==================== DACH ==================== */
  if (st === 'brick'){
    /* Sheddach: die klassische Fabrikform, Nordlicht über der Halle. */
    const par = 4;
    for (const [face,d] of faces){
      g.fillStyle = shade(trimC, d+dim);
      poly(g,[face(0,1),face(1,1),[face(1,1)[0],face(1,1)[1]-par],[face(0,1)[0],face(0,1)[1]-par]]); g.fill();
    }
    const top = -h-par;
    g.fillStyle = shade(roofC, 8+dim); diamond(g, 0, top, bw, bh); g.fill();
    // drei Zahnreihen quer über die Dachfläche
    for (let i=0;i<3;i++){
      const u0 = 0.10+i*0.30, u1 = u0+0.20;
      const e0 = [-bw/2+bw*u0, top+bh/2-bh*u0], e1 = [-bw/2+bw*u1, top+bh/2-bh*u1];
      const q0 = [e0[0]+bw*0.34, e0[1]+bh*0.34], q1 = [e1[0]+bw*0.34, e1[1]+bh*0.34];
      const rise = rH;
      g.fillStyle = shade(roofC,-18+dim);        // geneigte Fläche
      poly(g,[e0,e1,[e1[0],e1[1]-rise],[e0[0],e0[1]-rise]]); g.fill();
      g.fillStyle = lit ? 'rgba(255,206,105,.85)' : shade(glass,-10+dim);   // Oberlicht
      poly(g,[[e0[0],e0[1]-rise],[e1[0],e1[1]-rise],[q1[0],q1[1]-rise],[q0[0],q0[1]-rise]]); g.fill();
      g.strokeStyle = 'rgba(30,34,38,.55)'; g.lineWidth = 0.9;
      for (let k=1;k<4;k++){
        const a = mid([e0[0],e0[1]-rise],[e1[0],e1[1]-rise],k/4);
        const b2 = mid([q0[0],q0[1]-rise],[q1[0],q1[1]-rise],k/4);
        g.beginPath(); g.moveTo(a[0],a[1]); g.lineTo(b2[0],b2[1]); g.stroke();
      }
      g.fillStyle = shade(roofC,-34+dim);        // Rückwand des Zahns
      poly(g,[q0,q1,[q1[0],q1[1]-rise],[q0[0],q0[1]-rise]]); g.fill();
    }
    // hoher Fabrikschornstein aus Ziegel
    const sx2 = -bw*0.30, sy2 = top + bh*0.22, sh2 = 40, sw2 = 4.6;
    g.fillStyle = shade('#7E3E30',-6+dim);
    poly(g,[[sx2-sw2,sy2],[sx2,sy2+sw2*0.5],[sx2,sy2+sw2*0.5-sh2],[sx2-sw2,sy2-sh2]]); g.fill();
    g.fillStyle = shade('#7E3E30',-40+dim);
    poly(g,[[sx2,sy2+sw2*0.5],[sx2+sw2,sy2],[sx2+sw2,sy2-sh2],[sx2,sy2+sw2*0.5-sh2]]); g.fill();
    g.fillStyle = 'rgba(0,0,0,.14)';
    for (let i=1;i<7;i++){
      const yy = sy2 - sh2*i/7;
      poly(g,[[sx2-sw2,yy],[sx2,yy+sw2*0.5],[sx2,yy+sw2*0.5+1.6],[sx2-sw2,yy+1.6]]); g.fill();
    }
    g.fillStyle = shade('#C9B48C',-4+dim);   // heller Abschlussring
    diamond(g, sx2, sy2-sh2, sw2*2.6, sw2*1.3); g.fill();
    lastChimney = [sx2, sy2-sh2-2];
    return;
  }

  if (st === 'plant'){
    // Flachdach mit Lüftern, Rohrtrasse und Silo
    const par = 5, top = -h-par;
    for (const [face,d] of faces){
      g.fillStyle = shade(wallC, d+18+dim);
      poly(g,[face(0,1),face(1,1),[face(1,1)[0],face(1,1)[1]-par],[face(0,1)[0],face(0,1)[1]-par]]); g.fill();
    }
    g.fillStyle = shade(roofC, 8+dim); diamond(g, 0, top, bw, bh); g.fill();
    g.strokeStyle = 'rgba(0,0,0,.16)'; g.lineWidth = 1;
    for (const f of [0.4,0.7]){ diamond(g, 0, top, bw*f, bh*f); g.stroke(); }

    const roofBox = (px,py,rw,rh,col) => {
      const w2 = bw*rw, h2 = bh*rw;
      g.fillStyle = shade(col,-14+dim);
      poly(g,[[px-w2/2,py],[px,py+h2/2],[px,py+h2/2-rh],[px-w2/2,py-rh]]); g.fill();
      g.fillStyle = shade(col,-48+dim);
      poly(g,[[px,py+h2/2],[px+w2/2,py],[px+w2/2,py-rh],[px,py+h2/2-rh]]); g.fill();
      g.fillStyle = shade(col,10+dim); diamond(g,px,py-rh,w2,h2); g.fill();
    };
    // Rohrtrasse quer über das Dach
    g.strokeStyle = shade(trimC,-10+dim); g.lineWidth = 3;
    g.beginPath(); g.moveTo(-bw*0.30, top+bh*0.16); g.lineTo(bw*0.30, top-bh*0.16); g.stroke();
    // Lüfterkästen
    roofBox(-bw*0.24, top+bh*0.20, 0.26, 9, wallC);
    roofBox( bw*0.02, top+bh*0.02, 0.22, 7, wallC);
    roofBox( bw*0.26, top+bh*0.16, 0.20, 11, trimC);
    // Silo
    const sxx = -bw*0.06, syy = top - bh*0.20, sr = 7, sH = 22;
    g.fillStyle = shade('#B4BAB6',-32+dim);
    g.beginPath(); g.ellipse(sxx, syy, sr, sr*0.5, 0, 0, Math.PI);
    g.lineTo(sxx-sr, syy-sH);
    g.ellipse(sxx, syy-sH, sr, sr*0.5, 0, Math.PI, 0, true);
    g.closePath(); g.fill();
    g.fillStyle = shade('#CBD1CD',6+dim);
    g.beginPath(); g.ellipse(sxx, syy-sH, sr, sr*0.5, 0, 0, Math.PI*2); g.fill();
    g.strokeStyle = 'rgba(0,0,0,.18)'; g.lineWidth = 1;
    for (let i=1;i<4;i++){
      g.beginPath(); g.ellipse(sxx, syy-sH*i/4, sr, sr*0.5, 0, 0, Math.PI); g.stroke();
    }
    g.fillStyle = shade(trimC,dim);
    g.beginPath(); g.ellipse(sxx, syy-sH-1, sr*0.4, sr*0.2, 0, 0, Math.PI*2); g.fill();
    return;
  }

  if (st === 'modern' || st === 'glass'){
    // Flachdach mit Attika
    const par = 6;
    for (const [face,d] of faces){
      g.fillStyle = shade(wallC, d+10+dim);
      poly(g,[face(0,1),face(1,1),[face(1,1)[0],face(1,1)[1]-par],[face(0,1)[0],face(0,1)[1]-par]]); g.fill();
    }
    g.fillStyle = shade(wallC, 16+dim); diamond(g, 0, -h-par, bw, bh); g.fill();
    g.fillStyle = shade(roofC, dim);    diamond(g, 0, -h-par+2, bw*0.82, bh*0.82); g.fill();
    g.strokeStyle = 'rgba(0,0,0,.14)'; g.lineWidth = 1;
    diamond(g, 0, -h-par+2, bw*0.55, bh*0.55); g.stroke();   // Lichtkuppel
    // Aufbau: beim Wohnblock ein Treppenhaus, beim Hochhaus ein Staffelgeschoss
    const big = st === 'glass';
    const boxH = big ? 15 : 11;
    const bwx = bw*(big ? 0.56 : 0.30), bhx = bh*(big ? 0.56 : 0.30);
    const cx = big ? 0 : -bw*0.14, cy = -h-par+2 + bh*(big ? 0.06 : 0.10);
    g.fillStyle = shade(wallC,-12+dim);
    poly(g,[[cx-bwx/2,cy],[cx,cy+bhx/2],[cx,cy+bhx/2-boxH],[cx-bwx/2,cy-boxH]]); g.fill();
    g.fillStyle = shade(wallC,-46+dim);
    poly(g,[[cx,cy+bhx/2],[cx+bwx/2,cy],[cx+bwx/2,cy-boxH],[cx,cy+bhx/2-boxH]]); g.fill();
    if (big){                       // umlaufendes Fensterband am Staffelgeschoss
      g.fillStyle = lit ? 'rgba(255,206,105,.9)' : shade(glass,-8+dim);
      poly(g,[[cx-bwx/2,cy-boxH*0.72],[cx,cy+bhx/2-boxH*0.72],
              [cx,cy+bhx/2-boxH*0.34],[cx-bwx/2,cy-boxH*0.34]]); g.fill();
      g.fillStyle = lit ? 'rgba(255,206,105,.55)' : shade(glass,-34+dim);
      poly(g,[[cx,cy+bhx/2-boxH*0.72],[cx+bwx/2,cy-boxH*0.72],
              [cx+bwx/2,cy-boxH*0.34],[cx,cy+bhx/2-boxH*0.34]]); g.fill();
    }
    g.fillStyle = shade(wallC,6+dim); diamond(g,cx,cy-boxH,bwx,bhx); g.fill();

    // Mast mit Positionslicht
    g.strokeStyle = shade(trimC,20+dim); g.lineWidth = 1.4;
    const ax2 = big ? bw*0.10 : bw*0.24, ay2 = cy - boxH;
    const mast = big ? 21 : 20;
    g.beginPath(); g.moveTo(ax2,ay2); g.lineTo(ax2,ay2-mast); g.stroke();
    g.beginPath(); g.moveTo(ax2-4,ay2-mast*0.65); g.lineTo(ax2+4,ay2-mast*0.65); g.stroke();
    g.fillStyle = lit ? '#F2B035' : shade('#8B9095',dim);
    g.beginPath(); g.arc(ax2,ay2-mast-1,1.9,0,7); g.fill();

    if (!big){                       // TV-Antenne auf dem Treppenhaus
      g.strokeStyle = shade(trimC,-10+dim); g.lineWidth = 1;
      g.beginPath(); g.moveTo(cx,cy-boxH); g.lineTo(cx,cy-boxH-12); g.stroke();
      g.beginPath(); g.moveTo(cx-5,cy-boxH-8); g.lineTo(cx+5,cy-boxH-8);
      g.moveTo(cx-3.5,cy-boxH-11); g.lineTo(cx+3.5,cy-boxH-11); g.stroke();
      g.fillStyle = shade('#C46A5C',dim);
      g.beginPath(); g.arc(cx,cy-boxH-13,1.2,0,7); g.fill();
    } else {                         // Satellitenschüssel am Staffelgeschoss
      const dx3 = cx-bwx*.32, dy3 = cy-boxH+bhx*.16;
      g.strokeStyle = shade(trimC,-12+dim); g.lineWidth = 1.2;
      g.beginPath(); g.moveTo(dx3,dy3); g.lineTo(dx3,dy3-7); g.stroke();
      g.save(); g.translate(dx3,dy3-7); g.rotate(-.55);
      g.fillStyle = shade('#C4CED2',-12+dim);
      g.beginPath(); g.ellipse(0,-1,4.8,3.4,0,0,7); g.fill();
      g.fillStyle = shade('#C4CED2',12+dim);
      g.beginPath(); g.ellipse(-1.2,-1.9,2.3,1.5,0,0,7); g.fill();
      g.restore();
      g.fillStyle = shade(trimC,4+dim);
      g.beginPath(); g.arc(dx3+2.6,dy3-9.4,1,0,7); g.fill();
    }
    return;
  }

  // Satteldach: Traufe steht über, Giebelspitze sitzt auf der Wandflucht
  const E = st === 'rustic' ? 1.22 : 1.10, drop = st === 'rustic' ? 5 : 3;
  const ev = q => [q[0]*E, q[1]*E - h + drop];
  const eL=ev(L), eB=ev(B), eR=ev(R), eT=ev(T);
  const r1 = [(L[0]+T[0])/2*E, (L[1]+T[1])/2*E - h - rH];
  const r2 = [(B[0]+R[0])/2*E, (B[1]+R[1])/2*E - h - rH];
  const gp1 = [(L[0]+T[0])/2, (L[1]+T[1])/2 - h - rH];
  const gp2 = [(B[0]+R[0])/2, (B[1]+R[1])/2 - h - rH];

  g.fillStyle = shade(wallC, -52+dim); poly(g,[up(L),up(T),gp1]); g.fill();

  const slope = (a,b,c,d,col,rows) => {
    g.fillStyle = col; poly(g,[a,b,c,d]); g.fill();
    if (st === 'rustic'){
      g.strokeStyle = 'rgba(70,50,26,.16)'; g.lineWidth = 2.2;
    } else {
      g.strokeStyle = 'rgba(0,0,0,.20)'; g.lineWidth = 1;
    }
    for (let i=1;i<rows;i++){
      const s1 = mid(b,a,i/rows), s2 = mid(c,d,i/rows);
      g.beginPath(); g.moveTo(s1[0],s1[1]); g.lineTo(s2[0],s2[1]); g.stroke();
    }
  };
  const rows = st === 'rustic' ? 4 : 7;
  slope(r1, eT, eR, r2, shade(roofC,-30+dim), rows);
  slope(r1, eL, eB, r2, shade(roofC, 16+dim), rows);

  if (st === 'rustic'){          // dicke Reetkante und Firstrolle
    g.strokeStyle = shade(roofC,-16+dim); g.lineWidth = 4;
    g.beginPath(); g.moveTo(eL[0],eL[1]); g.lineTo(eB[0],eB[1]); g.stroke();
    g.strokeStyle = shade(roofC,-34+dim); g.lineWidth = 3.5;
    g.beginPath(); g.moveTo(r1[0],r1[1]); g.lineTo(r2[0],r2[1]); g.stroke();
  }

  // Gaube ab drei Geschossen
  if (s.floors >= 3){
    const bl = (u,v) => mid(mid(eL,eB,u), mid(r1,r2,u), v);
    const c = bl(0.5,0.34), w = 9;
    const p1=[c[0]-w,c[1]+3], p2=[c[0]+w,c[1]+6];
    g.fillStyle = shade(wallC,-20+dim);
    poly(g,[p1,p2,[p2[0],p2[1]-13],[p1[0],p1[1]-13]]); g.fill();
    g.fillStyle = lit ? '#FFCE69' : shade(glass,-20+dim);
    poly(g,[[p1[0]+3,p1[1]-3],[p2[0]-3,p2[1]-3],[p2[0]-3,p2[1]-10],[p1[0]+3,p1[1]-10]]); g.fill();
    g.fillStyle = shade(roofC,14+dim);
    poly(g,[[p1[0]-2,p1[1]-12],[p2[0]+2,p2[1]-12],[(p1[0]+p2[0])/2,(p1[1]+p2[1])/2-21]]); g.fill();
  }

  // Schornstein
  const ch = mid(mid(eL,eB,0.34), mid(r1,r2,0.34), 0.50);
  const cw = 5, chh = 14 + rH*0.30;
  const chC = st === 'stone' ? '#9A8272' : '#8A6A5A';
  g.fillStyle = shade(chC,-14+dim);
  poly(g,[[ch[0]-cw,ch[1]],[ch[0],ch[1]+cw*0.5],[ch[0],ch[1]+cw*0.5-chh],[ch[0]-cw,ch[1]-chh]]); g.fill();
  g.fillStyle = shade(chC,-46+dim);
  poly(g,[[ch[0],ch[1]+cw*0.5],[ch[0]+cw,ch[1]],[ch[0]+cw,ch[1]-chh],[ch[0],ch[1]+cw*0.5-chh]]); g.fill();
  g.fillStyle = shade(chC,-4+dim);
  diamond(g, ch[0], ch[1]-chh, cw*2.4, cw*1.2); g.fill();
  lastChimney = [ch[0], ch[1]-chh-2];

  // Sichtbarer Giebel
  g.fillStyle = shade(wallC,-30+dim); poly(g,[up(B),up(R),gp2]); g.fill();
  const gc = [(up(B)[0]+up(R)[0]+gp2[0])/3, (up(B)[1]+up(R)[1]+gp2[1])/3];
  if (st === 'timber' || st === 'rustic'){
    g.fillStyle = shade(trimC,-16+dim);
    const gb = (p,q,w) => { poly(g,[[p[0],p[1]-w],[q[0],q[1]-w],[q[0],q[1]+w],[p[0],p[1]+w]]); g.fill(); };
    gb(up(B), gp2, 1.6); gb(up(R), gp2, 1.6); gb(up(B), up(R), 1.6);
  }
  g.fillStyle = lit ? 'rgba(255,206,105,.92)' : shade(glass,-34+dim);
  diamond(g, gc[0], gc[1], 9, 9); g.fill();

  g.strokeStyle = shade(roofC,-8+dim); g.lineWidth = st === 'rustic' ? 3.5 : 2.4;
  g.beginPath(); g.moveTo(eB[0],eB[1]); g.lineTo(r2[0],r2[1]); g.lineTo(eR[0],eR[1]); g.stroke();

  // Rathausuhr und Wimpel
  if (s.clock){
    g.fillStyle = '#E8E0CC'; diamond(g, gc[0], gc[1]-1, 15, 15); g.fill();
    g.strokeStyle = '#3F5A6B'; g.lineWidth = 1.4;
    g.beginPath(); g.moveTo(gc[0],gc[1]-1); g.lineTo(gc[0],gc[1]-6); g.stroke();
    g.beginPath(); g.moveTo(gc[0],gc[1]-1); g.lineTo(gc[0]+4,gc[1]+1); g.stroke();
    const top = [(r1[0]+r2[0])/2, (r1[1]+r2[1])/2];
    g.strokeStyle = '#93A4AF'; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(top[0],top[1]); g.lineTo(top[0],top[1]-20); g.stroke();
    g.fillStyle = '#F2B035';   // Mastknauf — die Fahne selbst weht dynamisch
    g.beginPath(); g.arc(top[0],top[1]-21,1.7,0,7); g.fill();
  }
}

/* Ein Baum ist kein Quader — Stamm und Krone entstehen aus Kurven und Kreisen.
   Die Krone wird in drei Lagen gesetzt: Schatten unten rechts, Grundton,
   Licht oben links. Das ergibt Volumen ohne Farbverlauf. */
function paintTree(g, type, mode){
  const t = TYPES[type], big = t.tree === 'big';
  const dim = mode === 'cut' ? -40 : 0;
  const bw = TW*0.55, bh = TH*0.55;
  const leaf = big ? '#4F7C46' : '#5F8C4E';
  const th = t.trunkH, tw = big ? 5 : 3.2;

  g.fillStyle = 'rgba(0,0,0,.30)';
  diamond(g, 4, 3, bw*(big?1.14:0.84), bh*(big?1.14:0.84)); g.fill();

  // Beet
  g.fillStyle = shade('#38472F', dim);
  diamond(g, 0, 0, bw*(big?1.00:0.72), bh*(big?1.00:0.72)); g.fill();
  g.fillStyle = shade('#46583A', dim);
  diamond(g, 0, -1.5, bw*(big?0.88:0.62), bh*(big?0.88:0.62)); g.fill();

  if (big){                       // Steinkranz um den alten Baum
    g.fillStyle = shade('#7E8279', dim);
    for (let i=0;i<10;i++){
      const a = Math.PI*2*i/10;
      g.beginPath();
      g.ellipse(Math.cos(a)*bw*0.46, Math.sin(a)*bh*0.46 - 1.5, 3.2, 2, 0, 0, 7);
      g.fill();
    }
  }

  // Stamm mit leichter Wurzelverbreiterung
  g.fillStyle = shade('#6E5238', dim);
  g.beginPath();
  g.moveTo(-tw*1.7, 1);
  g.quadraticCurveTo(-tw*0.8, -th*0.55, -tw*0.5, -th);
  g.lineTo(tw*0.5, -th);
  g.quadraticCurveTo(tw*0.8, -th*0.55, tw*1.7, 1);
  g.closePath(); g.fill();
  g.fillStyle = 'rgba(0,0,0,.24)';
  g.beginPath();
  g.moveTo(0, 1); g.lineTo(0, -th); g.lineTo(tw*0.5, -th);
  g.quadraticCurveTo(tw*0.8, -th*0.55, tw*1.7, 1);
  g.closePath(); g.fill();

  if (big){                       // zwei Äste in die Krone
    g.strokeStyle = shade('#5E4630', dim); g.lineWidth = 3; g.lineCap = 'round';
    g.beginPath(); g.moveTo(-1,-th*0.72); g.quadraticCurveTo(-9,-th*0.95,-13,-th-6); g.stroke();
    g.beginPath(); g.moveTo( 1,-th*0.62); g.quadraticCurveTo( 9,-th*0.88, 12,-th-4); g.stroke();
    g.lineCap = 'butt';
  }

  const blobs = big
    ? [[0,-th-17,19],[-15,-th-8,13],[15,-th-9,12],[-7,-th-29,12],[9,-th-27,11]]
    : [[0,-th-10,12],[-9,-th-3,8.5],[9,-th-4,8],[-2,-th-18,8]];

  g.fillStyle = shade(leaf, -30+dim);           // Schattenlage
  for (const [x,y,r] of blobs){ g.beginPath(); g.arc(x+r*0.24, y+r*0.26, r, 0, 7); g.fill(); }
  g.fillStyle = shade(leaf, dim);               // Grundton
  for (const [x,y,r] of blobs){ g.beginPath(); g.arc(x, y, r*0.94, 0, 7); g.fill(); }
  g.fillStyle = shade(leaf, 26+dim);            // Lichtseite
  for (const [x,y,r] of blobs){ g.beginPath(); g.arc(x-r*0.26, y-r*0.28, r*0.52, 0, 7); g.fill(); }
  g.fillStyle = shade(leaf, 48+dim);            // Glanzlichter
  for (const [x,y,r] of blobs){ g.beginPath(); g.arc(x-r*0.40, y-r*0.44, r*0.22, 0, 7); g.fill(); }
}

function paintAny(g, type, level, mode){
  lastChimney = null;
  const t = TYPES[type];
  if (t.tree) paintTree(g, type, mode);
  else if (type === 'well') paintWell(g, mode);
  else paintHouse(g, type, level, mode);
}

function paintWell(g, mode){
  const dim = mode === 'cut' ? -40 : 0;
  g.fillStyle = 'rgba(0,0,0,.3)';
  diamond(g, 4, 3, 40, 20); g.fill();

  // Brunnenring
  const rw = 34, rh = 17, wallH = 11;
  g.fillStyle = shade('#8E958E',-40+dim);
  g.beginPath();
  g.ellipse(0,0,rw/2,rh/2,0,0,Math.PI); g.lineTo(-rw/2,-wallH);
  g.ellipse(0,-wallH,rw/2,rh/2,0,Math.PI,0,true); g.closePath(); g.fill();
  g.fillStyle = shade('#A8AFA9',4+dim);
  g.beginPath(); g.ellipse(0,-wallH,rw/2,rh/2,0,0,7); g.fill();
  g.fillStyle = '#1C2B2E';
  g.beginPath(); g.ellipse(0,-wallH,rw/2-4,rh/2-2.5,0,0,7); g.fill();
  g.fillStyle = 'rgba(120,170,180,.45)';
  g.beginPath(); g.ellipse(0,-wallH+1,rw/2-7,rh/2-4,0,0,7); g.fill();
  // Steinfugen
  g.strokeStyle = 'rgba(0,0,0,.22)'; g.lineWidth = 1;
  for (let i=0;i<7;i++){
    const a = Math.PI*(i/6);
    const x = Math.cos(a)*rw/2, y = Math.sin(a)*rh/2;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x,y-wallH); g.stroke();
  }
  // Pfosten, Querbalken, Kurbel
  g.fillStyle = shade('#6B4E3C',-6+dim);
  g.fillRect(-13,-wallH-26,3.5,26); g.fillRect(10,-wallH-26,3.5,26);
  g.fillStyle = shade('#5A4030',6+dim); g.fillRect(-14,-wallH-27,28,4);
  g.strokeStyle = '#C9C2B4'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(0,-wallH-23); g.lineTo(0,-wallH-11); g.stroke();
  g.fillStyle = shade('#6B4E3C',12+dim);
  g.fillRect(-4,-wallH-13,8,6);
  // Dächlein
  g.fillStyle = shade('#7C5540',10+dim);
  poly(g,[[-19,-wallH-27],[0,-wallH-25],[0,-wallH-41],[-19,-wallH-38]]); g.fill();
  g.fillStyle = shade('#7C5540',-26+dim);
  poly(g,[[0,-wallH-25],[19,-wallH-27],[19,-wallH-38],[0,-wallH-41]]); g.fill();
}

/* ============================================================
   7. BODEN UND STRASSEN
============================================================ */
function drawRoad(gx,gy,p){
  const live = state.net.has(key(gx,gy));
  const F = 0.52;
  const T=[p.x,p.y-TH/2], R=[p.x+TW/2,p.y], B=[p.x,p.y+TH/2], L=[p.x-TW/2,p.y];
  const Ti=[p.x,p.y-TH*F/2], Ri=[p.x+TW*F/2,p.y], Bi=[p.x,p.y+TH*F/2], Li=[p.x-TW*F/2,p.y];
  ctx.fillStyle = live ? '#6E6555' : '#3C453D';
  diamond(ctx,p.x,p.y,TW*F,TH*F); ctx.fill();

  let deg = 0;
  const links = [[[1,0],Ri,Bi,B,R],[[-1,0],Li,Ti,T,L],[[0,1],Bi,Li,L,B],[[0,-1],Ti,Ri,R,T]];
  for (const [d,i1,i2,o2,o1] of links){
    const n = at(gx+d[0],gy+d[1]);
    if (!n || (n.type!=='road' && n.type!=='hall')) continue;
    deg++;
    poly(ctx,[i1,i2,o2,o1]); ctx.fill();
  }

  if (live){
    // Bordstein: dunkle Außenkante, Lichtkante zur Nordseite
    ctx.strokeStyle = 'rgba(12,18,15,.55)'; ctx.lineWidth = 1;
    diamond(ctx,p.x,p.y,TW*F,TH*F); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.07)';
    ctx.beginPath(); ctx.moveTo(Ti[0],Ti[1]); ctx.lineTo(Li[0],Li[1]); ctx.stroke();

    // Mittellinie in jeder angeschlossenen Richtung
    ctx.strokeStyle = 'rgba(233,223,199,.27)'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
    for (const [dx,dy] of N4){
      const n = at(gx+dx,gy+dy);
      if (!n || (n.type!=='road' && n.type!=='hall')) continue;
      const ux = dx*TW*F*0.5, uy = dy*TH*F*0.5;
      ctx.beginPath();
      ctx.moveTo(p.x+ux*.52, p.y+uy*.52);
      ctx.lineTo(p.x+ux*.94, p.y+uy*.94);
      ctx.stroke();
    }
    ctx.lineCap = 'butt';

    // Kanaldeckel auf verstreuten Feldern
    if ((gx*7+gy*5)%11 === 0){
      ctx.fillStyle = 'rgba(18,24,20,.55)';
      ctx.beginPath(); ctx.ellipse(p.x+TW*.08, p.y+TH*.05, 3.4, 1.8, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.09)'; ctx.lineWidth = .8; ctx.stroke();
    }

    // Laterne an Kreuzungen und Endpunkten
    if (deg >= 2 && (gx*31+gy*17)%4 === 0){
      const lx = p.x-TW*.30, ly = p.y-TH*.03;
      ctx.fillStyle = 'rgba(242,176,53,'+(0.02+0.06*nightF).toFixed(3)+')';
      ctx.beginPath(); ctx.ellipse(lx+4, ly+1, 14, 6.5, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = '#2A3338'; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(lx,ly-15); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(lx,ly-15); ctx.lineTo(lx+4.4,ly-16.4); ctx.stroke();
      ctx.lineCap = 'butt';
      ctx.fillStyle = 'rgba(255,206,110,'+(0.04+0.18*nightF).toFixed(3)+')';
      ctx.beginPath(); ctx.arc(lx+5, ly-15.4, 4.8, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,217,143,'+(0.35+0.65*nightF).toFixed(3)+')';
      ctx.beginPath(); ctx.arc(lx+5, ly-15.4, 1.7, 0, 7); ctx.fill();
    }

    // Pflastersteine
    ctx.fillStyle = 'rgba(0,0,0,.14)';
    for (let i=0;i<5;i++){
      const a = -0.3+i*0.16;
      diamond(ctx, p.x+(a)*TW*0.5, p.y+(a)*TH*0.5, 9, 5); ctx.fill();
      diamond(ctx, p.x-(a)*TW*0.5, p.y+(a)*TH*0.5, 9, 5); ctx.fill();
    }
  } else {
    // Verlassene Straße: Schutt und Risse statt Pflaster
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    diamond(ctx, p.x+((gx*11+gy*3)%9)-4, p.y+((gy*7+gx)%5)-2, 4.5, 2.2); ctx.fill();
    diamond(ctx, p.x+((gy*13+gx*5)%7)-3, p.y+((gx*3+gy*11)%5)-1, 3, 1.6); ctx.fill();
    ctx.strokeStyle = 'rgba(196,106,92,.7)'; ctx.lineWidth = 1.2; ctx.setLineDash([3,3]);
    diamond(ctx,p.x,p.y,TW*F,TH*F); ctx.stroke(); ctx.setLineDash([]);
  }
}

/* Sichtfenster in Weltkoordinaten. topPad gibt hohen Gebäuden Luft nach oben,
   damit ein Turm am oberen Rand nicht verschwindet, bevor er ganz draußen ist. */
function viewBox(topPad){
  return {
    x0: cam.x - (W/2)/cam.z - TW,      x1: cam.x + (W/2)/cam.z + TW,
    y0: cam.y - (H/2)/cam.z - topPad,  y1: cam.y + (H/2)/cam.z + TH + DEPTH
  };
}
const inBox = (p,v) => p.x >= v.x0 && p.x <= v.x1 && p.y >= v.y0 && p.y <= v.y1;

function drawGround(){
  {
    const vis = viewBox(TH*2);
    for (const [gx,gy] of state.cells){
      const p = iso(gx,gy);
      if (!inBox(p, vis)) continue;          // außerhalb des Bildschirms
      const b = at(gx,gy);
      ctx.fillStyle = '#1E312B';
      poly(ctx,[[p.x-TW/2,p.y],[p.x,p.y+TH/2],[p.x,p.y+TH/2+DEPTH],[p.x-TW/2,p.y+DEPTH]]); ctx.fill();
      ctx.fillStyle = '#182720';
      poly(ctx,[[p.x,p.y+TH/2],[p.x+TW/2,p.y],[p.x+TW/2,p.y+DEPTH],[p.x,p.y+TH/2+DEPTH]]); ctx.fill();

      const lit = (gx+gy)%2 === 0;
      /* Blumenwiese: eine billige Sinusinsel im Feldraster entscheidet, wo
         das Gras dichter und bunter steht — deterministisch, also ruhig. */
      const mow = Math.sin(gx*0.37 + Math.sin(gy*0.29)*1.8)
                + Math.cos(gy*0.33 + Math.sin(gx*0.23)*1.6);
      const wiese = !b && mow > 1.15;
      ctx.fillStyle = lit ? '#3D5C4E' : '#375547';
      if (!b || !TYPES[b.type].aura){
        // Je stärker die Nachbarschaft verstärkt, desto wärmer der Boden
        let aura = 0;
        for (const [dx,dy] of N4){
          const nb = at(gx+dx,gy+dy);
          if (nb && TYPES[nb.type].aura) aura += TYPES[nb.type].aura;
        }
        if (aura > 0){
          const ramp = lit ? ['#47603F','#4F6A3C','#5C7539','#6A8036']
                           : ['#415A3A','#496437','#556E34','#637931'];
          ctx.fillStyle = ramp[Math.min(3, Math.floor(aura/0.6))];
        } else if (wiese){
          ctx.fillStyle = lit ? '#405A41' : '#3B543B';
        }
      }
      diamond(ctx,p.x,p.y,TW,TH); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.045)'; ctx.lineWidth = 1; ctx.stroke();

      // Gras und Blumen: Wiesen üppig, Einzelbüschel verstreut.
      // Der Wind läuft als Welle übers Feld — die Phase wandert mit (gx+gy).
      if (!b && wiese){
        ctx.lineWidth = 1;
        const sw = wind ? Math.sin(windT*1.8 - (gx+gy)*0.45) * 42 * wind : 0;
        for (let c=0;c<2;c++){                       // zwei dichte Horste
          const ox = (((gx*(c+2)+gy*13)%13)-6)+c*4, oy = (((gx*7+gy*(c+5))%9)-4);
          ctx.strokeStyle = 'rgba(158,196,148,.34)';
          for (let i=-1;i<3;i++){
            ctx.beginPath(); ctx.moveTo(p.x+ox+i*2.4, p.y+oy);
            ctx.lineTo(p.x+ox+i*2.4+i*.8+sw*(.7+.3*((i+c)%2)), p.y+oy-5-Math.abs(i));
            ctx.stroke();
          }
        }
        const cols = ['#C46A5C','#D8A94E','#D9D3C0'];   // sieben Blüten
        for (let k=0;k<7;k++){
          const fx = p.x+(((gx*(k+2)+gy*(k+5))%19)-9);
          const fy = p.y+(((gx*(k+7)+gy*(k+3))%11)-5);
          ctx.fillStyle = cols[(gx+gy+k)%3];
          ctx.beginPath(); ctx.arc(fx,fy,1.05,0,7); ctx.fill();
          ctx.fillStyle = 'rgba(120,160,110,.5)';
          ctx.fillRect(fx-.4, fy+.8, .8, 1.6);         // Stängel
        }
      } else if (!b && (gx*7+gy*13)%4 === 0){
        ctx.strokeStyle = 'rgba(150,185,150,.28)'; ctx.lineWidth = 1;
        const ox = ((gx*29+gy*17)%9)-4, oy = ((gx*13+gy*31)%5)-2;
        // dieselbe Wanderwelle, nur an der Halmspitze
        const sw = wind ? Math.sin(windT*1.8 - (gx+gy)*0.45) * 38 * wind : 0;
        for (let i=-1;i<2;i++){
          ctx.beginPath(); ctx.moveTo(p.x+ox+i*3, p.y+oy);
          ctx.lineTo(p.x+ox+i*3+i+sw, p.y+oy-4-Math.abs(i)); ctx.stroke();
        }
      } else if (!b && (gx*5+gy*11)%7 === 0){
        const cols = ['#C79A6E','#C9B36A','#9FB86A'];
        for (let k=0;k<3;k++){
          ctx.fillStyle = cols[k];
          ctx.beginPath();
          ctx.arc(p.x+(((gx*(k+3)+gy*(k+7))%11)-5),
                  p.y+(((gx*(k+5)+gy*3)%7)-3), 1.1, 0, 7);
          ctx.fill();
        }
      } else if (!b && (gx*17+gy*9)%9 === 0){
        ctx.fillStyle = 'rgba(146,160,152,.28)';
        diamond(ctx, p.x+((gx*11+gy)%9)-4, p.y+((gy*13+gx*3)%5)-2, 5, 2.4); ctx.fill();
        diamond(ctx, p.x+((gy*7)%7)-1, p.y+((gx*5)%5), 3.4, 1.7); ctx.fill();
      }
      if (b && b.type === 'road') drawRoad(gx,gy,p);

      // Feld, von dem das angehobene Gebäude stammt
      if (state.moving && state.moving.x===gx && state.moving.y===gy){
        const puls = reduceMotion ? 1 : 0.55 + 0.45*Math.sin(now()/320);
        ctx.fillStyle = 'rgba(242,176,53,' + (0.10*puls) + ')';
        diamond(ctx,p.x,p.y,TW,TH); ctx.fill();
        ctx.strokeStyle = 'rgba(242,176,53,' + (0.5 + 0.4*puls) + ')';
        ctx.lineWidth = 2; ctx.setLineDash([6,4]);
        diamond(ctx,p.x,p.y,TW*0.94,TH*0.94); ctx.stroke(); ctx.setLineDash([]);
      }

      if (state.hover && state.hover.x===gx && state.hover.y===gy){
        const need = TYPES[state.tool]?.stages[0].staff || 0;
        const afford = state.tool==='raze' || state.tool==='lift' || state.tool==='harvest' ||
                       state.tool==='move' ||
                       (state.coins >= (TYPES[state.tool]?.cost ?? 0) && need <= freePop());
        ctx.fillStyle = afford ? 'rgba(242,176,53,.16)' : 'rgba(196,106,92,.2)';
        diamond(ctx,p.x,p.y,TW,TH); ctx.fill();
        ctx.strokeStyle = afford ? 'rgba(242,176,53,.75)' : 'rgba(196,106,92,.8)';
        ctx.lineWidth = 1.5; ctx.stroke();
      }
    }
  }
}

/* ============================================================
   8. GEBÄUDE PLATZIEREN
============================================================ */
function drawBuilding(b, ghost){
  const s = stageOf(b), p = iso(b.x,b.y);
  const cut = !ghost && !b.active;
  const ready = !ghost && isReady(b);
  const mode = ghost ? 'idle' : cut ? 'cut' : ready ? 'lit' : 'idle';
  const tt = TYPES[b.type];
  const sp = sprite(b.type, b.level, mode);

  let k = 1;
  if (!reduceMotion && !ghost){
    const age = (now()-b.born)/430;
    if (age < 1) k = 0.4 + 0.6*(1-Math.pow(1-age,3));
  }

  const lifted = !ghost && state.moving &&
                 state.moving.x === b.x && state.moving.y === b.y;
  ctx.save();
  if (ghost) ctx.globalAlpha = 0.5;
  else if (lifted) ctx.globalAlpha = 0.32;    // Vorlage bleibt blass stehen
  if (ready && !reduceMotion){
    const pulse = 0.5+0.5*Math.sin(now()/380);
    ctx.shadowColor = 'rgba(242,176,53,'+(0.3+pulse*0.4)+')';
    ctx.shadowBlur = 16+pulse*14;
  }
  ctx.translate(p.x, p.y);
  if (k !== 1) ctx.scale(1,k);
  if (wind && tt.tree) ctx.transform(1, 0, swayOf(tt, b.x*1.7 + b.y*0.9), 1, 0, 0);
  ctx.drawImage(sp.cv, -sp.ax, -sp.ay, sp.w, sp.h);
  ctx.restore();
  if (ghost) return;

  // Die Rathausfahne weht — als einziges Teil dynamisch über dem Sprite
  if (b.type === 'hall' && !cut) drawPennant(p.x, p.y - s.h - s.roofH - 20);

  // Rauch aus dem Schornstein, solange produziert wird
  if (!cut && !ready && s.time > 0 && sp.smoke && !reduceMotion)
    puffSmoke(ctx, p.x + sp.smoke[0], p.y + sp.smoke[1], b.x*0.31 + b.y*0.17);

  /* Brunnen: ein Tropfen fällt, danach laufen Ringe über den Wasserspiegel.
     Alles aus einer Phase abgeleitet, damit kein Zustand mitgeführt werden muss. */
  if (b.type === 'well' && !reduceMotion){
    const t = (now()/2400 + b.x*0.37 + b.y*0.61) % 1;
    const cx = p.x, cy = p.y - 10;
    if (t < 0.30){                                   // Tropfen vom Eimer
      const f = t/0.30;
      ctx.fillStyle = 'rgba(158,206,214,.8)';
      ctx.beginPath();
      ctx.ellipse(cx, p.y - 23 + f*f*13, 1.3, 2.1 + f, 0, 0, 7);
      ctx.fill();
    }
    for (let i=0;i<2;i++){                           // zwei versetzte Ringe
      const f = (t + i*0.5) % 1;
      if (f > 0.68) continue;
      const q = f/0.68;
      ctx.strokeStyle = 'rgba(168,214,224,' + ((1-q)*0.55).toFixed(3) + ')';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(cx, cy, 1.4 + q*8.4, 0.6 + q*3.7, 0, 0, Math.PI*2);
      ctx.stroke();
    }
  }

  /* Glühwürmchen um Baumkronen — nur nachts, nur zwei Punkte je Baum */
  if (tt.tree && !reduceMotion && nightF > 0.05){
    const big2 = tt.tree === 'big', n2 = big2 ? 2 : 1;
    const cyc = p.y - tt.trunkH - (big2 ? 17 : 9);
    for (let i=0;i<n2;i++){
      const ph = now()/1000*.5 + i*2.7 + b.x*.83 + b.y*1.31;
